<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

search and resource-based context retrieval to inject concepts into agent prompts.","resource":"file:///D:/projects/okf-skills/okf-query/SKILL.md","tags":["retrieval","search","RAG","prompt-injection"],"color":"#94a3b8","size":33,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}},{"data":{"id":"concepts/okf-skill","label":"OKF Core Skill","type":"Skill","description":"Core skill that defines the structure and authoring guidelines of Open Knowledge Format (OKF) concept files.","resource":"file:///D:/projects/okf-skills/okf/SKILL.md","tags":["core","okf","documentation"],"color":"#94a3b8","size":34,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}},{"data":{"id":"concepts/okf-upgrade-skill","label":"OKF Upgrade Skill","type":"Skill","description":"Automatically upgrades an OKF concept bundle from v0.1 to v0.2 specification.","resource":"file:///D:/projects/okf-skills/okf-upgrade/SKILL.md","tags":["upgrade","migration","automation"],"color":"#94a3b8","size":32,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}},{"data":{"id":"concepts/okf-visualize-skill","label":"OKF Visualize Skill","type":"Skill","description":"Generates an interactive Cytoscape.js HTML graph visualization showing concepts and their relationships.","resource":"file:///D:/projects/okf-skills/okf-visualize/SKILL.md","tags":["visualization","graph","network"],"color":"#94a3b8","size":34,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}},{"data":{"id":"concepts/okf-wayfinder-skill","label":"OKF Wayfinder Skill","type":"Skill","description":"Guided wizard to bootstrap and document concepts using codebase context and focus questions.","resource":"file:///D:/projects/okf-skills/okf-wayfinder/SKILL.md","tags":["wizard","onboarding","creation","documentation"],"color":"#94a3b8","size":33,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}},{"data":{"id":"concepts/skill-installers","label":"Skill Installer Scripts","type":"Utility","description":"Automated scripts to install, update, and remove agent skills across different CLI platforms.","resource":"file:///D:/projects/okf-skills/install.ps1","tags":["installation","deployment","powershell","bash"],"color":"#94a3b8","size":34,"status":"stable","stale_after":"","verified":[],"generated":{"by":"human:blub0x","at":"2026-08-03T23:18:00Z"},"sources":[]}}],"edges":[{"data":{"id":"concepts/knowledge-loop__concepts/okf-skill","source":"concepts/knowledge-loop","target":"concepts/okf-skill"}},{"data":{"id":"concepts/knowledge-loop__concepts/okf-wayfinder-skill","source":"concepts/knowledge-loop","target":"concepts/okf-wayfinder-skill"}},{"data":{"id":"concepts/knowledge-loop__concepts/okf-query-skill","source":"concepts/knowledge-loop","target":"concepts/okf-query-skill"}},{"data":{"id":"concepts/knowledge-loop__concepts/okf-maintain-skill","source":"concepts/knowledge-loop","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/knowledge-loop__concepts/okf-lint-skill","source":"concepts/knowledge-loop","target":"concepts/okf-lint-skill"}},{"data":{"id":"concepts/knowledge-loop__concepts/okf-visualize-skill","source":"concepts/knowledge-loop","target":"concepts/okf-visualize-skill"}}],"bodies":{"concepts/interactive-simulator":"# Overview\r\nThe `index.html` file acts as an interactive simulator and playbook. It provides a visual, zero-dependency breakdown of the OKF pipeline lifecycle and an ongoing token efficiency calculator.\r\n\r\n# Key Features\r\n- **Pure CSS Interactive Pipeline**: Toggles active detail tabs for all 6 pipeline steps using pure CSS selectors (`:checked ~ label`), working without Javascript.\r\n- **Token Efficiency Simulator**: Calculates ongoing token consumption rates for traditional search exploration versus OKF-guided progressive disclosures on both legacy and greenfield codebases.\r\n- **Workflow Playbooks**: Outlines setup steps and strategies for deploying OKF in different project scopes.","concepts/knowledge-loop":"# Overview\r\nThe knowledge loop lifecycle binds the OKF skills together into a continuous self-documenting pipeline:\r\n\r\n1. **OKF Specification**: Defined by [OKF Core Skill](/concepts/okf-skill.md).\r\n2. **Initial Bundle Creation**: Bootstraps the concept files and directory structure using [OKF Core Skill](/concepts/okf-skill.md).\r\n3. **Guided Wizard Onboarding**: Guided by the [OKF Wayfinder Skill](/concepts/okf-wayfinder-skill.md) to interview developers and capture tribal knowledge.\r\n4. **AGENTS.md Steering**: Directs new agent sessions to check, read, and respect concepts.\r\n5. **Context Retrieval**: Runs [OKF Query Skill](/concepts/okf-query-skill.md) to automatically fetch and inject relevant concepts into agent prompts.\r\n6. **Model-Invoked Maintenance**: Automated post-edit checks run by [OKF Maintain Skill](/concepts/okf-maintain-skill.md) to update and validate concepts.\r\n7. **CI Quality & Drift Gate**: Uses [OKF Lint Skill](/concepts/okf-lint-skill.md) to statically analyze files and block PRs on broken links or un-synced concept drift.\r\n8. **Interactive Visualization**: Formulated by [OKF Visualize Skill](/concepts/okf-visualize-skill.md), allowing human-in-the-loop audit of the knowledge graph.\r\n\r\n# Purpose\r\nBy keeping documentation aligned with actual code state at commit/lifecycle boundaries, this workflow mitigates cold-starts for new agents or team members, enables token-efficient context retrieval, and completely eliminates documentation rot.","concepts/okf-lint-skill":"# Overview\r\nThe `okf-lint` skill is a static analysis tool that guarantees documentation quality and prevents concept-code drift at the repository level.\r\n\r\n# Verification Steps\r\n- **Conformance**: Checks that every concept has parseable frontmatter and a valid `type`.\r\n- **Link Integrity**: Checks that all internal markdown links (`[Label](/concepts/target.md)`) target files that exist. Strips code ticks and fenced code blocks first to ignore code examples.\r\n- **Concept Drift (`--drift`)**: Compares the `timestamp` in each concept with the Git last modified timestamp of the associated `resource` path. If the code file is newer than the documentation timestamp, it flags a warning to run `okf-maintain` to sync.","concepts/okf-maintain-skill":"# Overview\r\nThe `okf-maintain` skill runs post-edit to verify that codebase modifications match the state of OKF concepts. It identifies affected concepts, handles folder scale transitions, refactors broken links, and forces updating concepts to prevent documentation rot.\r\n\r\n# Workflow\r\n1. **Guard check**: Verifies the bundle directory exists (in this repo, `/docs/okf`).\r\n2. **Scan changes**: Maps modified or newly added code files, API routes, or database schemas to OKF concepts.\r\n3. **Update concepts**: Updates frontmatter metadata (especially the `timestamp`) and documents new facts/schemas.\r\n4. **Scale & Refactor Links**: Detects scale transitions (from flat to nested when concept count passes 10) and refactors all relative link references accordingly.\r\n5. **Update reserved files**: Appends to `log.md` and indexes new files/directories in `index.md`.\r\n6. **Verify conformance**: Ensures all concept files carry a valid `type` in their YAML frontmatter.","concepts/okf-query-skill":"# Overview\r\nThe `okf-query` skill retrieves context from the OKF bundle to inject it directly into the prompt of developers or active coding agents, closing the gap between writing and using documentation.\r\n\r\n# Operation Modes\r\n- **File Matching (`--file <path>`)**: Checks the `resource` field of all concepts. If a concept's resource maps to the queried file path or a parent directory, it fetches the concept content.\r\n- **Keyword Search (`--search <query>`)**: Scans all concepts' frontmatter fields (title, description, tags, type) and body content for the specified query, returning all matches.\r\n- **Output**: Formats the selected concepts into a clean markdown context block suitable for prompt ingestion.","concepts/okf-skill":"# Overview\r\nThe `okf` skill defines the Open Knowledge Format (OKF) rules for writing self-documenting codebases. It serves as the single source of truth for how a concept is authored, linked, structured, and organized.\r\n\r\n# Key Features\r\n- **YAML Frontmatter**: Requires `type`, recommends `title`, `description`, `resource`, `tags`, and `timestamp`.\r\n- **Bundle Directory**: In this repository, it is located at `/docs/okf`.\r\n- **Cross-linking**: Uses bundle-relative absolute paths to form an untyped concept dependency graph.\r\n- **Directory Organization**: Outlines how to transition from a flat layout to a nested directory structure as the concept count scales (>= 10 concepts).\r\n- **Steering Notice**: Sets up `AGENTS.md` (or `CLAUDE.md`) to guide autonomous agents to read/maintain the bundle.","concepts/okf-upgrade-skill":"# Overview\r\nThe `okf-upgrade` skill automates the migration of legacy OKF bundles to v0.2, upgrading metadata formats and citations.\r\n\r\n# Key Functions\r\n- Converts legacy `timestamp` keys into structured `generated: { by, at }` properties.\r\n- Migrates inline body `# Citations` lists to frontmatter `sources` lists.\r\n- Adds the root `okf_version: \"0.2\"` compatibility flag to the main index file.\r\n- Triggers post-migration lint validation.","concepts/okf-visualize-skill":"# Overview\r\nThe `okf-visualize` skill parses the concepts in the OKF bundle, extracts their frontmatter metadata and internal markdown links, builds a concept network graph, and compiles it into a self-contained interactive `viz.html` page.\r\n\r\n# Architecture & Script\r\n- **Script**: Located at [visualize.js](/okf-visualize/scripts/visualize.js).\r\n- **Templates**: Located under [templates/viz.html](/okf-visualize/templates/viz.html).\r\n- **Workflow**:\r\n  1. Walks the bundle directory (skipping `index.md` and `log.md`) to read concepts.\r\n  2. Extracts YAML frontmatter and internal links (`[Label](/path/to/target.md)`).\r\n  3. Builds Cytoscape.js nodes (colored by `type`) and edges.\r\n  4. Injects CSS, JS, and bundle JSON into the HTML template.\r\n  5. Outputs `viz.html` to the bundle root and copies it to the active conversation's artifact directory for easy rendering in the agent chat interface.","concepts/okf-wayfinder-skill":"# Overview\r\nThe `okf-wayfinder` skill serves as an interactive knowledge cartographer for the OKF bundle. It runs a developer-facing questionnaire to bridge the gap between static code structures and dynamic tribal business context.\r\n\r\n# Key Features\r\n- **Codebase Telemetry**: Scrapes schemas, route files, or config files to pre-fill a draft concept.\r\n- **Guided Interview**: Limits user fatigue by asking a maximum of three target questions (criticality, dependencies, failover owners).\r\n- **Taxonomy & Directory Selection**: Suggests existing types/tags using [wayfinder_taxonomy.js](/okf-wayfinder/scripts/wayfinder_taxonomy.js) and guides folder placement following scaling taxonomy guidelines.","concepts/skill-installers":"# Overview\r\nThe installer scripts, `install.ps1` (for Windows PowerShell) and `install.sh` (for macOS/Linux Bash), automate the process of registering, updating, and removing the OKF skills globally on a developer's system.\r\n\r\n# Supported Agents & Paths\r\nThe script detects and installs the skills to the configuration folders of all active LLM agent CLIs:\r\n- **Google Antigravity / Gemini CLI**: `~/.gemini/config/skills`\r\n- **Claude Code**: `~/.claude/skills`\r\n- **Universal / General Agents**: `~/.agents/skills`\r\n\r\n# Operations\r\n- **Install/Update**: Copies the local directories (`okf/`, `okf-maintain/`, `okf-visualize/`, and `okf-wayfinder/`) directly to target directories, overwriting previous versions. If run outside a clone, it fetches the zip from the GitHub main branch.\r\n- **Remove**: Deletes the skill folders recursively from the target paths."},"types":["Concept","Skill","Utility"],"palette":{"BigQuery Dataset":"#8b5cf6","BigQuery Table":"#3b82f6","Reference":"#10b981","Attested Computation":"#f59e0b"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // Dynamic v0.2 metadata display
    // Clean up any previously appended dynamic elements
    const dl = document.querySelector("dl.frontmatter");
    if (dl) {
      const existingDynamics = dl.querySelectorAll(".dynamic-fm");
      existingDynamics.forEach(el => el.remove());

      if (data.status) {
        const dt = document.createElement("dt");
        dt.className = "dynamic-fm";
        dt.textContent = "Status";
        const dd = document.createElement("dd");
        dd.className = "dynamic-fm";
        dd.textContent = data.status;
        dl.appendChild(dt);
        dl.appendChild(dd);
      }

      if (data.stale_after) {
        const dt = document.createElement("dt");
        dt.className = "dynamic-fm";
        dt.textContent = "Stale After";
        const dd = document.createElement("dd");
        dd.className = "dynamic-fm";
        
        const isStale = new Date(data.stale_after) <= new Date();
        dd.textContent = data.stale_after;
        if (isStale) {
          const warning = document.createElement("span");
          warning.style.color = "#dc2626";
          warning.style.fontWeight = "bold";
          warning.style.marginLeft = "8px";
          warning.textContent = "(Stale)";
          dd.appendChild(warning);
        }
        dl.appendChild(dt);
        dl.appendChild(dd);
      }

      // Trust tier calculation
      let trustTier = 'unverified';
      if (data.verified && (Array.isArray(data.verified) ? data.verified.length : Object.keys(data.verified).length)) {
        const verifications = Array.isArray(data.verified) ? data.verified : [data.verified];
        const hasHuman = verifications.some(v => v && v.by && String(v.by).startsWith('human:'));
        trustTier = hasHuman ? 'human-reviewed' : 'machine-confirmed';
      }
      const dt = document.createElement("dt");
      dt.className = "dynamic-fm";
      dt.textContent = "Trust Tier";
      const dd = document.createElement("dd");
      dd.className = "dynamic-fm";
      dd.textContent = trustTier;
      
      if (trustTier === 'human-reviewed') {
        dd.style.color = '#16a34a';
        dd.style.fontWeight = 'bold';
      } else if (trustTier === 'machine-confirmed') {
        dd.style.color = '#2563eb';
      } else {
        dd.style.color = '#64748b';
      }
      dl.appendChild(dt);
      dl.appendChild(dd);

      // Sources list
      if (data.sources && data.sources.length && data.sources[0]) {
        const dtSrc = document.createElement("dt");
        dtSrc.className = "dynamic-fm";
        dtSrc.textContent = "Sources";
        const ddSrc = document.createElement("dd");
        ddSrc.className = "dynamic-fm";
        
        data.sources.forEach(src => {
          if (!src) return;
          const div = document.createElement("div");
          div.style.marginBottom = "4px";
          if (src.resource) {
            const a = document.createElement("a");
            a.href = src.resource;
            a.textContent = src.title || src.id || src.resource;
            a.target = "_blank";
            a.rel = "noopener";
            a.className = "external";
            div.appendChild(a);
          } else {
            div.textContent = src.title || src.id || "Unnamed source";
          }
          if (src.author) {
            const authorSpan = document.createElement("span");
            authorSpan.className = "muted";
            authorSpan.style.marginLeft = "6px";
            authorSpan.textContent = `by ${src.author}`;
            div.appendChild(authorSpan);
          }
          ddSrc.appendChild(div);
        });
        dl.appendChild(dtSrc);
        dl.appendChild(ddSrc);
      }
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
