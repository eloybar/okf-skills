<html lang="en">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

oncepts/okf-specification","target":"concepts/okf-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-lint-skill","source":"concepts/okf-specification","target":"concepts/okf-lint-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-query-skill","source":"concepts/okf-specification","target":"concepts/okf-query-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-upgrade-skill","source":"concepts/okf-specification","target":"concepts/okf-upgrade-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-visualize-skill","source":"concepts/okf-specification","target":"concepts/okf-visualize-skill"}},{"data":{"id":"concepts/okf-specification__concepts/knowledge-loop","source":"concepts/okf-specification","target":"concepts/knowledge-loop"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-specification","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-specification"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-maintain-skill","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-lint-skill","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-lint-skill"}}],"bodies":{"concepts/git-development-workflow":"# Git Development and Pull Request Workflow\n\n## 1. Overview\nTo ensure code quality, keep a clean, flat linear history on `main`, and run automated tests before merges, all code changes must follow a strict branching and Pull Request (PR) workflow. \n\n**Direct pushes to `main` are prohibited for standard feature development.**\n\n### 1.1 Pull Request Sizing & Commit Grouping\nA Pull Request (PR) represents a cohesive, testable **logical unit of work** (e.g., a feature, a bug fix, or a documentation block), rather than a single commit. \n\n* **Group Commits by Logical Task:** When implementing a feature, commit incrementally locally for work in progress (e.g., adding logic, adding tests, updating docs), but push and open a **single PR** containing all these related commits. This allows reviews to happen holistically on the completed feature.\n* **Avoid Micro-PRs:** Creating a PR for every single individual commit is discouraged as it causes CI/CD queue congestion and review fatigue.\n* **Single-Commit PRs:** These are reserved exclusively for simple standalone actions, such as quick documentation copy edits or minor configuration patches.\n\n---\n\n## 2. Step-by-Step Workflow\n\n```mermaid\ngraph TD\n    A[\"Create Feature Branch\"] --> B[\"Commit Changes Locally\"]\n    B --> C[\"Push Branch to Remote\"]\n    C --> D[\"Create Pull Request\"]\n    D --> E[\"Run Tests & CI Checks\"]\n    E --> F[\"Rebase and Merge PR\"]\n    F --> G[\"Sync Local main\"]\n```\n\n### Step 1: Create a Feature Branch\nAlways create a clean, descriptive branch off of the latest `main`:\n```bash\ngit checkout main\ngit pull --ff-only\ngit checkout -b feat/your-feature-name\n```\nBranch naming conventions:\n- `feat/*` for new capabilities or user-facing enhancements\n- `fix/*` for bug fixes and patches\n- `docs/*` for documentation or knowledge bundle updates\n- `perf/*` for performance improvements\n\n### Step 2: Commit Changes\nCommit changes incrementally with clear, value-communicating commit messages following conventional commits format:\n```bash\ngit add .\ngit commit -m \"feat(scope): brief description of feature\"\n```\n\n### Step 3: Run Verification\nBefore pushing, run the project's test suite and lint checks to ensure no regressions (see [OKF Lint Skill](/concepts/okf-lint-skill.md)):\n```bash\nnode okf-lint/scripts/lint.js --drift  # OKF conformance & drift check\nnode scripts/test-lifecycle.js        # Integration lifecycle test suite\n```\n\n### Step 4: Push to Remote\nPush the branch to origin to set up tracking:\n```bash\ngit push -u origin HEAD\n```\n\n### Step 5: Create a Pull Request (PR)\nCreate a PR using the GitHub CLI (`gh`) or the GitHub Web interface:\n```bash\ngh pr create --title \"feat(scope): your feature title\" --body \"Adaptive description of changes.\"\n```\n\n### Step 6: Rebase and Merge\nOnce reviews and CI gates pass, merge the PR using the **rebase and merge** strategy to maintain a flat linear history:\n```bash\ngh pr merge --rebase --delete-branch\n```\n\n### Step 7: Synchronize Local main\nUpdate your local `main` and clean up local feature branches:\n```bash\ngit checkout main\ngit pull --ff-only\n```\n\n---\n\n## 3. Mandate for AI Coding Agents\n\nTo preserve the repository's audit trail, maintain code-review validation, and respect branch protection configurations:\n1. **Commit changes locally** on a dedicated feature branch.\n2. **Push the branch to remote** and **create a Pull Request (PR)**.\n3. **Rebase and merge** the PR and **delete the feature branch** (both remote and local) once fully merged.\n\nAI agents are prohibited from pushing directly to `main` for standard feature implementations or documentation catalog modifications, unless explicitly authorized or requested by the user.","concepts/interactive-simulator":"# Overview\r\nThe `index.html` file acts as an interactive simulator and playbook. It provides a visual, zero-dependency breakdown of the OKF pipeline lifecycle and an ongoing token efficiency calculator.\r\n\r\n# Key Features\r\n- **Pure CSS Interactive Pipeline**: Toggles active detail tabs for all pipeline steps using pure CSS selectors (`:checked ~ label`), working without Javascript.\r\n- **Automated Live Skill Snippet Synchronization**: Kept 100% synchronized with live `SKILL.md` and script files across all skills via [`scripts/sync-skills.js`](/scripts/sync-skills.js) (`npm run okf:sync` and `npm run okf:sync:check`), invoked automatically by `okf-maintain`.\r\n- **Token Efficiency Simulator**: Calculates ongoing token consumption rates for traditional search exploration versus OKF-guided progressive disclosures on both legacy and greenfield codebases.\r\n- **Workflow Playbooks**: Outlines setup steps and strategies for deploying OKF in different project scopes.","concepts/knowledge-loop":"# Overview\r\nThe knowledge loop lifecycle binds the OKF skills together into a continuous self-documenting pipeline backed by the canonical shared parser and serializer core in [`scripts/lib/okf-core.js`](/scripts/lib/okf-core.js) and automated skill/playbook synchronizer in [`scripts/sync-skills.js`](/scripts/sync-skills.js):\r\n\r\n1. **OKF Specification**: Standardized by the [OKF Specification v0.2](/concepts/okf-specification.md) and operationalized by [OKF Core Skill](/concepts/okf-skill.md).\r\n2. **Initial Bundle Creation**: Bootstraps the concept files and directory structure using [OKF Core Skill](/concepts/okf-skill.md).\r\n3. **Guided Wizard Onboarding**: Guided by the [OKF Wayfinder Skill](/concepts/okf-wayfinder-skill.md) to interview developers and capture tribal knowledge.\r\n4. **Agent Steering Gates**: Enforces mandatory Pre-Work Grounding Gates and Pre-Completion Verification Gates via `AGENTS.md`, `CLAUDE.md`, or IDE rules to guide autonomous agents to check, read, and maintain concepts.\r\n5. **Context Retrieval**: Runs [OKF Query Skill](/concepts/okf-query-skill.md) to automatically fetch and inject relevant concepts into agent prompts.\r\n6. **Model-Invoked Maintenance**: Automated post-edit checks run by [OKF Maintain Skill](/concepts/okf-maintain-skill.md) to update and validate concepts.\r\n7. **CI Quality & Drift Gate**: Uses [OKF Lint Skill](/concepts/okf-lint-skill.md) to statically analyze files and block PRs on broken links or un-synced concept drift.\r\n8. **Interactive Visualization**: Formulated by [OKF Visualize Skill](/concepts/okf-visualize-skill.md), allowing human-in-the-loop audit of the knowledge graph.\r\n9. **Bundle Upgrader**: Automated migration of legacy bundles from v0.1 format to v0.2 using [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md).\r\n10. **Lifecycle Pruning & Garbage Collection**: Identifies, archives, or purges stale, deprecated, ghost, or orphaned concepts using [OKF Prune Skill](/concepts/okf-prune-skill.md).\r\n\r\n# Purpose\r\nBy keeping documentation aligned with actual code state at commit/lifecycle boundaries, this workflow mitigates cold-starts for new agents or team members, enables token-efficient context retrieval, and completely eliminates documentation rot.","concepts/okf-course":"# Overview\r\nThe [OKF Academy Interactive Course](/concepts/okf-course.md) provides a progressive educational track (**Beginner → Architect**) teaching software engineers, tech leads, and AI agent builders how to adopt and operate the [Open Knowledge Format (OKF) Specification v0.2](/concepts/okf-specification.md) across the [Knowledge Loop Lifecycle](/concepts/knowledge-loop.md)[^course-web-app][^course-syllabus].\r\n\r\n# Dual-Surface Architecture\r\n1. **Interactive Web Application (`course.html`)**: A zero-dependency browser application matching the [Interactive Simulator & Playbook](/concepts/interactive-simulator.md) design system[^course-web-app]. Features `localStorage` progress tracking, a side-by-side **OKF v0.1 vs. v0.2 Diff & Problem-Solver Explorer**, an interactive **Trust Tier State Machine Simulator**, copyable CLI Lab cards, Agent Tutor prompts, and module quizzes.\r\n2. **Markdown Curriculum & Practice Sandbox (`docs/course/`)**: Seven comprehensive Markdown modules (`01` through `07`) accompanied by an isolated practice sandbox (`docs/course/sandbox/`) containing legacy v0.1, expired (`stale_after`), and v0.2 `Attested Computation` fixtures[^course-syllabus].\r\n\r\n# Related Concepts\r\n- [OKF Specification v0.2](/concepts/okf-specification.md)\r\n- [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md)\r\n- [Interactive Simulator & Playbook](/concepts/interactive-simulator.md)\r\n- [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md)\r\n- [OKF Prune Skill](/concepts/okf-prune-skill.md)\r\n\r\n[^course-web-app]: Implemented in `course.html` at the repository root.\r\n[^course-syllabus]: Documented in `docs/course/README.md` and modules `01` through `07`.","concepts/okf-lint-skill":"# Overview\r\nThe `okf-lint` skill is a static analysis tool that guarantees documentation quality and prevents concept-code drift at the repository level in compliance with OKF Specification v0.2.\r\n\r\n# Verification Steps\r\n- **Conformance & Lifecycle Validation**: Checks that every concept has parseable frontmatter, a valid `type`, and (if present) a valid lifecycle `status` (`draft | stable | deprecated`, §5.4).\r\n- **Provenance & Footnote Attribution (§5.1, §7)**: Validates structured `sources` objects (`resource` required, `sources[].author` actor format without `agent:` prefix) and checks that any `sources[].id` defined for inline attribution is referenced by a matching `[^id]` footnote in the Markdown body (and vice versa).\r\n- **Attested Computation Verification (§10)**: Validates `runtime`, `computation`, `executor`, and `attester` metadata on `Attested Computation` concepts, and warns if neither a frontmatter `computation` URI nor an inline `# Computation` section is provided (§10.3).\r\n- **Link Integrity**: Checks that all internal markdown links (`[Label](/concepts/target.md)`) target files that exist. Strips code ticks and fenced code blocks first to ignore code examples.\r\n- **Concept Drift (`--drift`)**: Compares the `generated.at` timestamp (falling back to legacy `timestamp`) in each concept with the latest modification timestamp of associated `resource`, `sources` (string and object entries), `computation`, `executor.resource`, and `attester.resource` paths (checking both `git log -1` and uncommitted working-tree/staged `mtime` via `git status --porcelain`). Also emits a `[Drift Warning]` if any modified/added workspace code file is not bound to any concept.\r\n- **Freshness & Stale Concepts**: Validates the optional `stale_after` timestamp instant (§5.4). Emits a warning when the current date has surpassed the concept's `stale_after` date, flagging that the concept needs re-verification.\r\n- **Agent Steering Notice Auditing**: Audits all present agent steering files (`AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `.windsurfrules`, `.clinerules`, `GEMINI.md`) in the workspace root for outdated steering templates (v1.8.1) or missing Pre-Work Grounding Gates, Model-Tier Routing, or Pre-Completion Verification Gates.\r\n- **Machine-Readable Output (`--json`)**: Emits structured JSON summary metrics for automated CI/CD pipelines and agent reasoning.","concepts/okf-maintain-skill":"# Overview\r\nThe `okf-maintain` skill runs post-edit to verify that codebase modifications match the state of OKF concepts. It provides both an automated CLI maintenance script ([`maintain.js`](/okf-maintain/scripts/maintain.js)) for rapid mechanical upkeep and guided workflows for authoring new concepts when architecture changes.\r\n\r\n# Architecture & CLI Automation\r\n- **Script**: Located at [`okf-maintain/scripts/maintain.js`](/okf-maintain/scripts/maintain.js).\r\n- **Execution Modes**:\r\n  - `node okf-maintain/scripts/maintain.js` (or `npm run okf:maintain`): Automatically detects concept-resource drift across `resource`, `sources` (string and object entries), `computation`, `executor.resource`, and `attester.resource` via both committed Git history (`git log -1`) and uncommitted working-tree/staged changes (`git status --porcelain` + filesystem `mtime`), normalizes both string and object entries in `sources:`, refreshes `generated.at`, auto-heals outdated agent steering notices (`AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `.windsurfrules`, `.clinerules`, `GEMINI.md`) to the v1.8.1 template (including Model-Tier Routing) without user prompting, scans for unindexed frontier files (skipping `archive/` and nested git repositories) and graduates bound files out of `## Not yet specified` in `index.md`, appends entries to `log.md`, regenerates `viz.html` (`--no-open` via sibling skill resolution), and verifies with `okf-lint --drift`.\r\n  - `node okf-maintain/scripts/maintain.js --check`: Non-destructive audit mode that exits with code 1 if committed or working-tree drift, unindexed frontier files, or outdated steering notices are found.\r\n  - `node okf-maintain/scripts/maintain.js --json`: Outputs structured JSON for CI and subagent tooling.\r\n\r\n# Steering Template\r\n`buildSteeringDirectivesBlock(bundleRelPath, targetVersion, skillsBase)` renders the steering block (about 450 tokens) in this order: `## 📂 Knowledge Bundle / OKF` (where the bundle is, the closest-parent `okf/` rule, the session-start lint/maintain sync), `## ⚡ Pre-Work Grounding Gate` (1 Search, 2 Per-file context, 3 Cite, 4 Model-Tier Routing) and `## ⚡ Pre-Completion Verification Gate` (1 Semantic Concept & Source Binding Upkeep, 2 Maintain, 3 Lint), then the version tag.\r\n- **Runnable commands**: `resolveSkillsBase(workspaceRoot)` builds the script path prefix from `maintain.js`'s own install location. The prefix is workspace-relative when the skills live in the repo (in this repo it is empty, so commands read `node okf-query/...`), `~/`-relative when they live under the home directory, and absolute otherwise. The bundle path is written workspace-relative with no leading slash (e.g. `docs/okf`).\r\n- **Compatibility contract**: `okf-lint` and `okf-maintain --check` require the strings `Pre-Work Grounding Gate`, `Pre-Completion Verification Gate`, `Model-Tier Routing` and the `<!-- okf-steering-version: X -->` tag. `scripts/test-lifecycle.js` also asserts `Semantic Concept & Source Binding Upkeep`. Keep all of these when editing the template.\r\n- Both helpers are exported from `maintain.js`.\r\n\r\n# Workflow\r\n1. **Guard check**: Verifies the bundle directory exists (in this repo, `/docs/okf`).\r\n2. **Scan changes**: Maps modified or newly added code files, API routes, computation scripts, or database schemas to OKF concepts.\r\n3. **Update concepts**: Updates frontmatter metadata (especially the `generated` block) and documents new facts/schemas.\r\n4. **Scale & Refactor Links**: Detects scale transitions (from flat to nested when concept count passes 10) and refactors all relative link references accordingly.\r\n5. **Update reserved files**: Appends to `log.md` and indexes new files/directories in `index.md`.\r\n6. **Verify conformance**: Ensures all concept files carry a valid `type` in their YAML frontmatter.","concepts/okf-prune-skill":"# Overview\r\nThe `okf-prune` skill manages bundle hygiene and concept lifecycles by detecting and cleaning up outdated or invalid knowledge documents. It provides automated CLI workflows for archiving or permanently removing expired, deprecated, orphaned, or broken concepts.\r\n\r\n# Key Functions\r\n- **Audit & Check Mode**: Detects concepts that have passed `stale_after` expiration, carry `status: deprecated`, reference deleted local files across `resource`, `sources` (string and object entries), `computation`, `executor.resource`, and `attester.resource` (while safely ignoring non-`file://` URI schemes like `bigquery://` and scope descriptors), or have zero inbound links across markdown body links and `sources` concept lineage references.\r\n- **Safe Archiving**: By default, moves pruned concepts into an `archive/` directory within the bundle, updates frontmatter with `status: deprecated` and `archived_at`, and relocates concept links in `index.md` to an `## Archived Concepts` section.\r\n- **Permanent Deletion Mode**: Allows complete removal of obsolete concepts via the `--delete` flag.\r\n- **Category Filtering**: Allows selective pruning targeting only stale (`--stale`), deprecated (`--deprecated`), ghost (`--ghosts`), or orphaned (`--orphans`) concepts.\r\n- **Changelog & Visualization Sync**: Appends entries to `log.md` detailing pruned items and triggers graph visualization updates (`--no-open`).","concepts/okf-query-skill":"# Overview\r\nThe `okf-query` skill retrieves context from the OKF bundle to inject it directly into the prompt of developers or active coding agents, closing the gap between writing and using documentation.\r\n\r\n# Operation Modes\r\n- **File Matching (`--file <path>`)**: Checks `resource`, `sources` (supporting both shorthand string arrays and structured object arrays), `computation`, `executor.resource`, and `attester.resource` across all active concepts (skipping `archive/`). If a concept's bound resource maps to the queried file path or an enclosing parent directory (Tier 1), or resides within the same subsystem/directory (Tier 2), it fetches the concept content. Falls back to search suggestions if no direct concept is found.\r\n- **Keyword Search (`--search <query>`)**: Scans all active concepts' frontmatter fields (`title`, `description`, `tags`, `type`, `resource`, `sources` strings/objects/authors/ids, `runtime`, `computation`, `executor.resource`, `attester.resource`) and body content for the specified query, returning all matches.\r\n- **Output**: Formats the selected concepts (including `Runtime` and `Computation` metadata when present) into a clean markdown context block suitable for prompt ingestion.","concepts/okf-skill":"# Overview\nThe `okf` skill defines the Open Knowledge Format (OKF) rules for writing self-documenting codebases, directly implementing the [OKF Specification v0.2](/concepts/okf-specification.md). It serves as the single source of truth for how a concept is authored, linked, structured, and organized.\n\n# Key Features\n- **YAML Frontmatter**: Requires `type`, recommends `title`, `description`, `resource`, `tags`, `status`, `stale_after`, `generated`, `verified`, and `sources` (both shorthand string lists and structured provenance objects).\n- **Bundle Directory**: In this repository, it is located at `/docs/okf`.\n- **Cross-linking**: Uses bundle-relative absolute paths to form an untyped concept dependency graph.\n- **Directory Organization**: Outlines how to transition from a flat layout to a nested directory structure as the concept count scales (>= 10 concepts).\n- **Steering Notice (v1.8.1)**: Sets up agent steering files (e.g. `AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `GEMINI.md`) with mandatory Pre-Work Grounding Gates (including Step 4: Model-Tier Routing, directing agents to use the **High** reasoning setting during bundle bootstrapping, domain discovery, and planning, then switch back to **Medium** for implementation) and 3-step Pre-Completion Verification Gates on the **Medium** setting (Step 1: Semantic Concept & Source Binding Upkeep, Step 2: Maintain, Step 3: Lint), rendered by the concise template in [OKF Maintain Skill](/concepts/okf-maintain-skill.md).","concepts/okf-specification":"# Overview\n\nThe [Open Knowledge Format (OKF)](/concepts/okf-specification.md) is an open, human- and agent-friendly specification for capturing and exchanging curated knowledge that surrounds code, data, and systems. Version 0.2 standardizes metadata conventions making agent-maintained knowledge corpora trustable, fresh, and auditable without bespoke runtimes.\n\n# Core Principles\n\n- **Readable**: Plain UTF-8 markdown files viewable without proprietary tooling.\n- **Parseable**: Standard YAML frontmatter parseable across all agent platforms.\n- **Diffable**: Trackable and reviewable in git version control.\n- **Portable**: Shareable across repositories, organizations, and runtime environments.\n\n# Key Specification Elements\n\n## 1. Bundle Structure & Reserved Files\n- **Concepts**: Every non-reserved `.md` document represents a concept and requires a non-empty `type` in frontmatter.\n- **`index.md`**: Directory listing supporting progressive disclosure. The bundle-root `index.md` may declare `okf_version: \"0.2\"`.\n- **`log.md`**: Chronological update log using `## YYYY-MM-DD` date headings.\n\n## 2. Provenance, Trust, and Lifecycle\n- **Provenance (`sources`)**: Structured list of reference materials, with credibility signals (`author`, `usage_count`, `last_modified`) and `usage_window`. Claims can cite sources using markdown footnotes (`[^id]`).\n- **Trust (`generated` & `verified`)**:\n  - `generated: { by, at }`: Records author identity using the actor format `<producer>/<version>`, `human:<id>`, or `process:<id>`, alongside an ISO 8601 UTC timestamp.\n  - `verified: [{ by, at }]`: Records independent confirmation events, inferring trust tiers: `unverified`, `machine-confirmed`, or `human-reviewed`.\n- **Lifecycle (`status` & `stale_after`)**:\n  - `status`: `draft`, `stable` (default), or `deprecated`.\n  - `stale_after`: Absolute ISO 8601 UTC instant marking content expiration.\n\n## 3. Attested Computations\nConcepts of `type: Attested Computation` bind a sanctioned calculation contract:\n- `runtime`: Execution environment (e.g. `bigquery`, `postgres`, `python`, `dbt`).\n- `parameters`: Typed parameter specifications for deterministic substitution.\n- `computation`: Inline block under `# Computation` or an external file path.\n- `executor` & `attester`: References to run instructions/receipts and deterministic verification code.\n\n# Repository Implementation\n\nIn this repository, the specification is implemented and supported across the skill suite:\n- [OKF Core Skill](/concepts/okf-skill.md) — Authoring concepts according to the format.\n- [OKF Lint Skill](/concepts/okf-lint-skill.md) — Conformance validation, link integrity, and drift analysis.\n- [OKF Query Skill](/concepts/okf-query-skill.md) — Provenance search and context injection.\n- [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md) — Automated migration from v0.1 to v0.2.\n- [OKF Visualize Skill](/concepts/okf-visualize-skill.md) — Interactive Cytoscape graph rendering.\n- [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md) — Closed-loop lifecycle binding the skills.","concepts/okf-upgrade-skill":"# Overview\r\nThe `okf-upgrade` skill automates the migration of legacy OKF bundles to the v0.2 specification, upgrading metadata formats, actor identifiers, and provenance citations while preserving existing v0.2 fields.\r\n\r\n# Key Functions\r\n- Converts legacy `timestamp` keys into structured `generated: { by, at }` properties and normalizes actor strings (stripping prohibited `agent:` prefixes in `generated.by`, `verified.by`, `executor.by`, `attester.by`, and `sources[].author` per §5.1, §7).\r\n- Migrates inline body `# Citations` lists to frontmatter `sources` lists while preserving both v0.2 shorthand string sources and structured source objects (`id`, `resource`, `title`, `author`, `usage_count`, `last_modified`).\r\n- Adds the root `okf_version: \"0.2\"` compatibility flag to `index.md` and normalizes `log.md` date headings to `## YYYY-MM-DD`.\r\n- Supports custom bundle paths via `--bundle <path>`, skips archived concepts under `archive/`, and triggers post-migration lint validation.","concepts/okf-visualize-skill":"# Overview\r\nThe `okf-visualize` skill parses the active concepts in the OKF bundle, extracts their frontmatter metadata and internal markdown links, builds a concept network graph, and compiles it into a self-contained interactive `viz.html` page.\r\n\r\n# Architecture & Script\r\n- **Script**: Located at [visualize.js](/okf-visualize/scripts/visualize.js).\r\n- **Templates**: Located under [templates/viz.html](/okf-visualize/templates/viz.html).\r\n- **Workflow**:\r\n  1. Walks the bundle directory (skipping `index.md`, `log.md`, and `archive/`) to read active concepts.\r\n  2. Extracts YAML frontmatter (including OKF v0.2 `generated`, `verified`, `sources` strings & objects, `usage_window`, and `Attested Computation` fields `runtime`, `parameters`, `computation`, `executor`, `attester`) and internal links across Markdown body, `sources`, `computation`, `executor.resource`, and `attester.resource`.\r\n  3. Builds Cytoscape.js nodes (colored by `type` across standard and architectural taxonomy types) and edges (`links` and `derived-from`).\r\n  4. Injects CSS, JS, and bundle JSON into the HTML template, rendering rich provenance, credibility signals (`usage_count`, `last_modified`), and Attested Computation metadata in the interactive sidebar.\r\n  5. Outputs `viz.html` to the bundle root and copies it to the active conversation's artifact directory for easy rendering in the agent chat interface.","concepts/okf-wayfinder-skill":"# Overview\r\nThe `okf-wayfinder` skill serves as an interactive knowledge cartographer for the OKF bundle. It runs a developer-facing questionnaire combined with automated codebase telemetry to bridge the gap between static code structures and dynamic tribal business context, producing `human-reviewed` concepts that conform to [OKF Specification v0.2](/concepts/okf-specification.md).\r\n\r\n# Key Features\r\n- **Registry, Graph & Taxonomy Discovery**: Runs [`wayfinder_taxonomy.js`](/okf-wayfinder/scripts/wayfinder_taxonomy.js) (`npm run okf:wayfinder` or `--bundle <path>`) to extract existing `types`, `tags`, `concepts` (with ready-to-use `markdownLink` strings), `layoutMode` (`flat` vs `nested`), active `subdirectories`, and undocumented workspace files (`frontier`). Automatically tracks `resource`, `sources`, and `Attested Computation` dependencies (`computation`, `executor.resource`, `attester.resource`), while ignoring archived concept folders and nested git repositories.\r\n- **Clustered Frontier Proposals (`frontierGroups`)**: Groups undocumented workspace files by directory/module with a suggested `type`, primary `resource` candidate (`primaryCandidate`), and companion `sources` (`companionFiles`) so an entire module graduates out of `## Not yet specified` in `index.md` in a single interview.\r\n- **Automated File Telemetry (`--inspect <file>`)**: Extracts exported symbols, local relative imports/requires, auto-resolved `relatedConcepts` cross-links, `git log -1` timestamps (`lastModified`), and primary Git contributors (`suggestedVerifierActor`) to pre-fill draft concepts.\r\n- **Type-Aware Focus Interview**: Limits user fatigue to at most three targeted questions tailored to the concept type (`Concept`, `Skill`, `Utility`, `Playbook`, `Decision`, or `Attested Computation`), utilizing native structured question tools (`ask_question` / `AskUserQuestion`) when available.\r\n- **Human-Reviewed Trust Attestation & Post-Authoring Sync**: Records developer approval in `verified: [{ by: human:<id>, at: <ISO-8601> }]` to immediately establish the `human-reviewed` trust tier, and finishes by invoking [OKF Maintain Skill](/concepts/okf-maintain-skill.md) and [OKF Lint Skill](/concepts/okf-lint-skill.md) (`--drift`) to update `index.md`, `log.md`, and `viz.html`.\r\n- **Model-Tier Steering**: Recommends running on the **High** reasoning setting of the active model during initial bundle bootstrapping and interactive concept discovery interviews, then switching back to **Medium** for implementation and routine upkeep.","concepts/skill-installers":"# Overview\r\nThe installer scripts, `install.ps1` (for Windows PowerShell) and `install.sh` (for macOS/Linux Bash), automate the process of registering, updating, and removing the OKF skills globally on a developer's system.\r\n\r\n# Supported Agents & Paths\r\nThe script detects and installs the skills to the configuration folders of all active LLM agent CLIs:\r\n- **Google Antigravity / Gemini CLI**: `~/.gemini/config/skills`\r\n- **Claude Code**: `~/.claude/skills`\r\n- **Universal / General Agents**: `~/.agents/skills`\r\n\r\n# Operations\r\n- **Install/Update**: Copies the skill directories (`okf/`, `okf-maintain/`, `okf-visualize/`, `okf-wayfinder/`, `okf-lint/`, `okf-query/`, `okf-upgrade/`, and `okf-prune/`) directly to target directories, overwriting previous versions. If run outside a clone, it fetches the zip from the GitHub main branch.\r\n- **Remove**: Deletes the skill folders recursively from the target paths."},"types":["Concept","Playbook","Reference","Skill","Utility"],"palette":{"BigQuery Dataset":"#8b5cf6","BigQuery Table":"#3b82f6","Reference":"#10b981","Attested Computation":"#f59e0b","Concept":"#0ea5e9","Skill":"#6366f1","Playbook":"#ec4899","Utility":"#14b8a6","Decision":"#f97316","Metric":"#eab308","Subsystem":"#2563eb"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function appendDynamicRow(dl, label, valueNodeOrText) {
    const dt = document.createElement("dt");
    dt.className = "dynamic-fm";
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.className = "dynamic-fm";
    if (typeof valueNodeOrText === "string") {
      dd.textContent = valueNodeOrText;
    } else {
      dd.appendChild(valueNodeOrText);
    }
    dl.appendChild(dt);
    dl.appendChild(dd);
    return dd;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // Dynamic v0.2 metadata display
    const dl = document.querySelector("dl.frontmatter");
    if (dl) {
      const existingDynamics = dl.querySelectorAll(".dynamic-fm");
      existingDynamics.forEach(el => el.remove());

      if (data.status) {
        appendDynamicRow(dl, "Status", data.status);
      }

      if (data.stale_after) {
        const dd = appendDynamicRow(dl, "Stale After", data.stale_after);
        const isStale = new Date(data.stale_after) <= new Date();
        if (isStale) {
          const warning = document.createElement("span");
          warning.style.color = "#dc2626";
          warning.style.fontWeight = "bold";
          warning.style.marginLeft = "8px";
          warning.textContent = "(Stale)";
          dd.appendChild(warning);
        }
      }

      // Trust tier calculation (§5.3)
      let trustTier = "unverified";
      if (data.verified && (Array.isArray(data.verified) ? data.verified.length : Object.keys(data.verified).length)) {
        const verifications = Array.isArray(data.verified) ? data.verified : [data.verified];
        const hasHuman = verifications.some(v => v && v.by && String(v.by).startsWith("human:"));
        trustTier = hasHuman ? "human-reviewed" : "machine-confirmed";
      }
      const trustDd = appendDynamicRow(dl, "Trust Tier", trustTier);
      if (trustTier === "human-reviewed") {
        trustDd.style.color = "#16a34a";
        trustDd.style.fontWeight = "bold";
      } else if (trustTier === "machine-confirmed") {
        trustDd.style.color = "#2563eb";
      } else {
        trustDd.style.color = "#64748b";
      }

      // Generated metadata (§5.2)
      if (data.generated && (data.generated.by || data.generated.at)) {
        const parts = [];
        if (data.generated.by) parts.push(data.generated.by);
        if (data.generated.at) parts.push(`at ${data.generated.at}`);
        appendDynamicRow(dl, "Generated", parts.join(" "));
      }

      // Attested Computation metadata (§10.2)
      if (data.runtime) {
        appendDynamicRow(dl, "Runtime", data.runtime);
      }
      if (data.computation) {
        appendDynamicRow(dl, "Computation", data.computation);
      }
      if (Array.isArray(data.parameters) && data.parameters.length > 0) {
        const paramText = data.parameters
          .map(p => `${p.name}:${p.type || "any"}${p.required ? "*" : ""}`)
          .join(", ");
        appendDynamicRow(dl, "Parameters", paramText);
      }
      if (data.executor && data.executor.resource) {
        const receiptInfo = Array.isArray(data.executor.receipt) ? ` (receipt: ${data.executor.receipt.join(", ")})` : "";
        appendDynamicRow(dl, "Executor", `${data.executor.resource}${receiptInfo}`);
      }
      if (data.attester && data.attester.resource) {
        appendDynamicRow(dl, "Attester", data.attester.resource);
      }

      // Sources list (§5.1: supports both shorthand strings and structured objects)
      if (data.sources && data.sources.length && data.sources[0]) {
        const srcContainer = document.createElement("div");
        data.sources.forEach(src => {
          if (!src) return;
          const div = document.createElement("div");
          div.style.marginBottom = "4px";
          if (typeof src === "string") {
            const a = document.createElement("a");
            a.href = src;
            a.textContent = src;
            a.target = "_blank";
            a.rel = "noopener";
            a.className = "external";
            div.appendChild(a);
          } else {
            if (src.resource) {
              const a = document.createElement("a");
              a.href = src.resource;
              a.textContent = src.title || src.id || src.resource;
              a.target = "_blank";
              a.rel = "noopener";
              a.className = "external";
              div.appendChild(a);
            } else {
              div.textContent = src.title || src.id || "Unnamed source";
            }
            const metaParts = [];
            if (src.author) metaParts.push(`by ${src.author}`);
            if (src.usage_count !== undefined) metaParts.push(`usage: ${src.usage_count}`);
            if (src.last_modified) metaParts.push(`modified: ${src.last_modified}`);
            if (metaParts.length > 0) {
              const metaSpan = document.createElement("span");
              metaSpan.className = "muted";
              metaSpan.style.marginLeft = "6px";
              metaSpan.textContent = `(${metaParts.join(" · ")})`;
              div.appendChild(metaSpan);
            }
          }
          srcContainer.appendChild(div);
        });
        appendDynamicRow(dl, "Sources", srcContainer);
      }

      if (data.usage_window && (data.usage_window.from || data.usage_window.to)) {
        appendDynamicRow(dl, "Usage Window", `${data.usage_window.from || "?"} → ${data.usage_window.to || "?"}`);
      }
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
</html>
