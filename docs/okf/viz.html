.controls input { width: 220px; }

  background: #fff;
}
#detail-empty {

.type-chip {

dl.frontmatter {

  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {

#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

      <section id="detail-backlinks" hidden>

</main>

ncepts/okf-learn-skill__concepts/okf-maintain-skill","source":"concepts/okf-learn-skill","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/okf-learn-skill__concepts/okf-query-skill","source":"concepts/okf-learn-skill","target":"concepts/okf-query-skill"}},{"data":{"id":"concepts/okf-maintain-skill__concepts/okf-learn-skill","source":"concepts/okf-maintain-skill","target":"concepts/okf-learn-skill"}},{"data":{"id":"concepts/okf-skill__concepts/okf-specification","source":"concepts/okf-skill","target":"concepts/okf-specification"}},{"data":{"id":"concepts/okf-skill__concepts/okf-maintain-skill","source":"concepts/okf-skill","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-skill","source":"concepts/okf-specification","target":"concepts/okf-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-lint-skill","source":"concepts/okf-specification","target":"concepts/okf-lint-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-query-skill","source":"concepts/okf-specification","target":"concepts/okf-query-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-upgrade-skill","source":"concepts/okf-specification","target":"concepts/okf-upgrade-skill"}},{"data":{"id":"concepts/okf-specification__concepts/okf-visualize-skill","source":"concepts/okf-specification","target":"concepts/okf-visualize-skill"}},{"data":{"id":"concepts/okf-specification__concepts/knowledge-loop","source":"concepts/okf-specification","target":"concepts/knowledge-loop"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-specification","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-specification"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-maintain-skill","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/okf-wayfinder-skill__concepts/okf-lint-skill","source":"concepts/okf-wayfinder-skill","target":"concepts/okf-lint-skill"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/okf-maintain-skill","source":"concepts/skill-catalog-sync","target":"concepts/okf-maintain-skill"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/interactive-simulator","source":"concepts/skill-catalog-sync","target":"concepts/interactive-simulator"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/knowledge-loop","source":"concepts/skill-catalog-sync","target":"concepts/knowledge-loop"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/okf-upgrade-skill","source":"concepts/skill-catalog-sync","target":"concepts/okf-upgrade-skill"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/skill-installers","source":"concepts/skill-catalog-sync","target":"concepts/skill-installers"}},{"data":{"id":"concepts/skill-catalog-sync__concepts/okf-prune-skill","source":"concepts/skill-catalog-sync","target":"concepts/okf-prune-skill"}}],"bodies":{"concepts/git-development-workflow":"# Git Development and Pull Request Workflow\r\n\r\n## 1. Overview\r\nTo ensure code quality, keep a clean, flat linear history on `main`, and run automated tests before merges, all code changes must follow a strict branching and Pull Request (PR) workflow. \r\n\r\n**Direct pushes to `main` are prohibited for standard feature development.**\r\n\r\n### 1.1 Pull Request Sizing & Commit Grouping\r\nA Pull Request (PR) represents a cohesive, testable **logical unit of work** (e.g., a feature, a bug fix, or a documentation block), rather than a single commit. \r\n\r\n* **Group Commits by Logical Task:** When implementing a feature, commit incrementally locally for work in progress (e.g., adding logic, adding tests, updating docs), but push and open a **single PR** containing all these related commits. This allows reviews to happen holistically on the completed feature.\r\n* **Avoid Micro-PRs:** Creating a PR for every single individual commit is discouraged as it causes CI/CD queue congestion and review fatigue.\r\n* **Single-Commit PRs:** These are reserved exclusively for simple standalone actions, such as quick documentation copy edits or minor configuration patches.\r\n\r\n---\r\n\r\n## 2. Step-by-Step Workflow\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"Create Feature Branch\"] --> B[\"Commit Changes Locally\"]\r\n    B --> C[\"Push Branch to Remote\"]\r\n    C --> D[\"Create Pull Request\"]\r\n    D --> E[\"Run Tests & CI Checks\"]\r\n    E --> F[\"Rebase and Merge PR\"]\r\n    F --> G[\"Sync Local main\"]\r\n```\r\n\r\n### Step 1: Create a Feature Branch\r\nAlways create a clean, descriptive branch off of the latest `main`:\r\n```bash\r\ngit checkout main\r\ngit pull --ff-only\r\ngit checkout -b feat/your-feature-name\r\n```\r\nBranch naming conventions:\r\n- `feat/*` for new capabilities or user-facing enhancements\r\n- `fix/*` for bug fixes and patches\r\n- `docs/*` for documentation or knowledge bundle updates\r\n- `perf/*` for performance improvements\r\n\r\n### Step 2: Commit Changes\r\nCommit changes incrementally with clear, value-communicating commit messages following conventional commits format:\r\n```bash\r\ngit add .\r\ngit commit -m \"feat(scope): brief description of feature\"\r\n```\r\n\r\n### Step 3: Run Verification\r\nBefore pushing, run the project's test suite and lint checks to ensure no regressions (see [OKF Lint Skill](/concepts/okf-lint-skill.md)):\r\n```bash\r\nnode okf-lint/scripts/lint.js --drift  # OKF conformance & drift check\r\nnode scripts/test-lifecycle.js        # Integration lifecycle test suite\r\n```\r\n\r\n### Step 4: Push to Remote\r\nPush the branch to origin to set up tracking:\r\n```bash\r\ngit push -u origin HEAD\r\n```\r\n\r\n### Step 5: Create a Pull Request (PR)\r\nCreate a PR using the GitHub CLI (`gh`) or the GitHub Web interface:\r\n```bash\r\ngh pr create --title \"feat(scope): your feature title\" --body \"Adaptive description of changes.\"\r\n```\r\n\r\n### Step 6: Rebase and Merge\r\nOnce reviews and CI gates pass, merge the PR using the **rebase and merge** strategy to maintain a flat linear history:\r\n```bash\r\ngh pr merge --rebase --delete-branch\r\n```\r\n\r\n### Step 7: Synchronize Local main\r\nUpdate your local `main` and clean up local feature branches:\r\n```bash\r\ngit checkout main\r\ngit pull --ff-only\r\n```\r\n\r\n---\r\n\r\n## 3. Mandate for AI Coding Agents\r\n\r\nTo preserve the repository's audit trail, maintain code-review validation, and respect branch protection configurations:\r\n1. **Commit changes locally** on a dedicated feature branch.\r\n2. **Push the branch to remote** and **create a Pull Request (PR)**.\r\n3. **Rebase and merge** the PR and **delete the feature branch** (both remote and local) once fully merged.\r\n\r\nAI agents are prohibited from pushing directly to `main` for standard feature implementations or documentation catalog modifications, unless explicitly authorized or requested by the user.","concepts/interactive-simulator":"# Overview\r\nThe `index.html` file acts as an interactive simulator and playbook. It provides a visual, zero-dependency breakdown of all 11 steps of [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md) and an ongoing token efficiency calculator.\r\n\r\n# Key Features\r\n- **Pure CSS Interactive Pipeline (Steps 01–11)**: Toggles active detail cards and code tabs (`#toggle-step-1` through `#toggle-step-11`) for all pipeline steps and all 9 OKF skills (`okf`, `okf-wayfinder`, `okf-query`, `okf-maintain`, `okf-lint`, `okf-visualize`, `okf-upgrade`, `okf-prune`, `okf-learn`) using pure CSS selectors (`:checked ~`), working without JavaScript.\r\n- **Automated Live Skill Snippet Synchronization**: Kept 100% synchronized with live `SKILL.md` and script files across all skills via [`scripts/sync-skills.js`](/scripts/sync-skills.js) (`npm run okf:sync` and `npm run okf:sync:check`), governed by [Skill Lifecycle & Documentation Synchronization Playbook](/concepts/skill-catalog-sync.md) and invoked automatically by [OKF Maintain Skill](/concepts/okf-maintain-skill.md).\r\n- **Token Efficiency Simulator**: Calculates ongoing token consumption rates for traditional search exploration versus OKF-guided progressive disclosures on both legacy and greenfield codebases.\r\n- **Workflow Playbooks**: Outlines setup steps and strategies for deploying OKF in different project scopes.","concepts/knowledge-loop":"# Overview\r\nThe knowledge loop lifecycle binds the OKF skills together into a continuous self-documenting pipeline backed by the canonical shared parser and serializer core in [`scripts/lib/okf-core.js`](/scripts/lib/okf-core.js) and automated skill/playbook synchronizer in [`scripts/sync-skills.js`](/scripts/sync-skills.js):\r\n\r\n1. **OKF Specification**: Standardized by the [OKF Specification v0.2](/concepts/okf-specification.md) and operationalized by [OKF Core Skill](/concepts/okf-skill.md).\r\n2. **Initial Bundle Creation**: Bootstraps the concept files and directory structure using [OKF Core Skill](/concepts/okf-skill.md).\r\n3. **Guided Wizard Onboarding**: Guided by the [OKF Wayfinder Skill](/concepts/okf-wayfinder-skill.md) to interview developers and capture tribal knowledge.\r\n4. **Agent Steering Gates**: Enforces mandatory Pre-Work Grounding Gates and Pre-Completion Verification Gates via `AGENTS.md`, `CLAUDE.md`, or IDE rules to guide autonomous agents to check, read, and maintain concepts.\r\n5. **Context Retrieval**: Runs [OKF Query Skill](/concepts/okf-query-skill.md) to automatically fetch and inject relevant concepts into agent prompts.\r\n6. **Model-Invoked Maintenance**: Automated post-edit checks run by [OKF Maintain Skill](/concepts/okf-maintain-skill.md) to update and validate concepts.\r\n7. **CI Quality & Drift Gate**: Uses [OKF Lint Skill](/concepts/okf-lint-skill.md) to statically analyze files and block PRs on broken links or un-synced concept drift.\r\n8. **Interactive Visualization**: Formulated by [OKF Visualize Skill](/concepts/okf-visualize-skill.md), allowing human-in-the-loop audit of the knowledge graph.\r\n9. **Bundle Upgrader**: Automated migration of legacy bundles from v0.1 format to v0.2 using [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md).\r\n10. **Lifecycle Pruning & Garbage Collection**: Identifies, archives, or purges stale, deprecated, ghost, or orphaned concepts using [OKF Prune Skill](/concepts/okf-prune-skill.md).\r\n11. **Skill Self-Improvement Feedback Loop**: Passively logs CLI telemetry (`~/.okf/telemetry.jsonl`) across `okf-query`, `okf-maintain`, and `okf-lint`, surfaces a 1-line anomaly nudge at pre-completion sync, and runs retrospective session/telemetry analysis and auto-remediation via [OKF Learn Skill](/concepts/okf-learn-skill.md) (`okf-learn/scripts/learn.js`).\r\n\r\n# Purpose\r\nBy keeping documentation aligned with actual code state at commit/lifecycle boundaries, this workflow mitigates cold-starts for new agents or team members, enables token-efficient context retrieval, and completely eliminates documentation rot.","concepts/okf-course":"# Overview\r\nThe [OKF Academy Interactive Course](/concepts/okf-course.md) provides a progressive educational track (**Beginner → Architect**) teaching software engineers, tech leads, and AI agent builders how to adopt and operate the [Open Knowledge Format (OKF) Specification v0.2](/concepts/okf-specification.md) across the [Knowledge Loop Lifecycle](/concepts/knowledge-loop.md)[^course-web-app][^course-syllabus].\r\n\r\n# Dual-Surface Architecture\r\n1. **Interactive Web Application (`course.html`)**: A zero-dependency browser application matching the [Interactive Simulator & Playbook](/concepts/interactive-simulator.md) design system[^course-web-app]. Features `localStorage` progress tracking, a side-by-side **OKF v0.1 vs. v0.2 Diff & Problem-Solver Explorer**, an interactive **Trust Tier State Machine Simulator**, copyable CLI Lab cards, Agent Tutor prompts, and module quizzes.\r\n2. **Markdown Curriculum & Practice Sandbox (`docs/course/`)**: Seven comprehensive Markdown modules (`01` through `07`) accompanied by an isolated practice sandbox (`docs/course/sandbox/`) containing legacy v0.1, expired (`stale_after`), and v0.2 `Attested Computation` fixtures[^course-syllabus].\r\n\r\n# Related Concepts\r\n- [OKF Specification v0.2](/concepts/okf-specification.md)\r\n- [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md)\r\n- [Interactive Simulator & Playbook](/concepts/interactive-simulator.md)\r\n- [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md)\r\n- [OKF Prune Skill](/concepts/okf-prune-skill.md)\r\n\r\n[^course-web-app]: Implemented in `course.html` at the repository root.\r\n[^course-syllabus]: Documented in `docs/course/README.md` and modules `01` through `07`.","concepts/okf-learn-skill":"# Overview\r\nThe `okf-learn` skill closes the retrospective self-improvement loop in [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md). While [OKF Maintain Skill](/concepts/okf-maintain-skill.md) performs mechanical post-edit synchronization, `okf-learn` inspects completed or active coding sessions (`transcript.jsonl`) alongside passive zero-token CLI telemetry (`~/.okf/telemetry.jsonl`) and cross-repo skill learning notes (`~/.okf/skill-learnings.jsonl`) to surface and fix documentation and tooling friction.\r\n\r\n# Architecture & CLI Modes\r\n- **Script**: Located at [`okf-learn/scripts/learn.js`](/okf-learn/scripts/learn.js).\r\n- **Session & Telemetry Audit (`node okf-learn/scripts/learn.js [<conversation-id> | --latest] [--recent [N]] [--exclude <id>] [--brain-dir <path>] [--json]`)**:\r\n  - **Smart `--latest` & Multi-Runtime Discovery**: Discovers transcripts across both Gemini Antigravity (`~/.gemini/antigravity-cli/brain/<id>/.system_generated/logs/transcript.jsonl`) and Claude Code (`~/.claude/projects/<slug>/<session-id>.jsonl`, `~/.claude-*/projects/`, `$CLAUDE_CONFIG_DIR/projects/`), auto-detects the transcript format (`antigravity` or `claude-code`, deduplicating Claude Code assistant `message.usage` token counts by `message.id`), and emits an explicit `conversation.warning` when a requested transcript is missing or has an unrecognized schema. When `--latest` is passed without an explicit conversation ID, `evaluateSkillsPerformance` automatically skips short `<6` step meta-sessions and single-turn `/okf-learn` meta-sessions (`isMetaLearnTranscript`) in favor of the most recent substantive coding session (`>= 6` steps), and `--recent [N]` summarizes the last `N` (default `5`) substantive sessions across all workspaces (`inferredWorkspace` resolved via `record.cwd` or `inferWorkspaceFromPath`, gate score, and friction).\r\n  - **Gate Compliance**: Scores adherence to the 4 mandatory OKF Steering Gates (`sessionStartLint`, `preWorkQueries` including `query.js`, `wayfinder_taxonomy.js`, and `okf/` concept/`index.md` reads, `conceptCitations` across both nested `docs/okf/` and flat `okf/<slug>.md` bundles, and `preCompletionMaintain`).\r\n  - **Quantitative Friction**: Detects `queryMisses` (distinguishing `mode: 'file'` vs. `mode: 'search'`, extracting searched terms from `No matching OKF concepts found for search:` or originating `--search` commands while ignoring partial misses inside multi-keyword shell loops that returned concept matches, and excluding `read_file`/`Read` outputs), `fallbacksUsed` (suffix/basename/directory rescues), `contextBloat` (conversation-scoped `OKF CONTEXT BLOCK` outputs exceeding 40 KB), `slowCommands` (backgrounded standalone OKF CLI commands, excluding compound test-runner invocations like `npx jest`), and `toolErrors` (`edit_file` target-not-found vs. missing files).\r\n  - **Qualitative Learning Signals (`learningSignals`)**: Extracts corrective user turns (`userCorrections`, filtering out `isMeta: true` / `isSidechain: true` / `isCompactSummary: true` records, Claude Code context-continuation summaries, `tool_result` outputs, injected `SKILL.md` expansions starting with `Base directory for this skill:`, `<command-name>` blocks, attribute-bearing `<pasted_content ...>...</pasted_content ...>` logs, and fenced code blocks via `sanitizeUserTurnText`) and identifies oversized active concepts (`oversizedConcepts` with body > 12 KB) in the bundle.\r\n  - **Cross-Repo Skill Learnings Queue (`skillLearningsQueue`)**: Reads queued skill-level findings from `~/.okf/skill-learnings.jsonl` (overridable via `OKF_SKILL_LEARNINGS_PATH` or `--learnings`) and synthesizes a `HIGH` priority `skill-backlog` recommendation when entries exist.\r\n  - **Actionable Recommendations**: Synthesizes prioritized (`HIGH` / `MED` / `LOW`) remediation steps, separating `--bind` file-coverage recommendations (`concept-coverage`) from keyword/tag search-coverage recommendations (`search-coverage`).\r\n- **Auto-Binding Remediation (`node okf-learn/scripts/learn.js --bind <file> --concept <concept-rel-path>`)**:\r\n  - Automatically adds a missed or newly discovered workspace file to the target concept's `sources:` frontmatter (preserving CRLF/LF line endings and refreshing `generated.at`) so future [OKF Query Skill](/concepts/okf-query-skill.md) `--file` lookups resolve at Tier 1.\r\n- **Cross-Repo Skill Note Queueing (`node okf-learn/scripts/learn.js --note \"<message>\" [--skill <name>] [--category <cat>]`)**:\r\n  - Appends a structured skill improvement item (`{ timestamp, workspaceRoot, skill, category, message }`) to `~/.okf/skill-learnings.jsonl` during any external project session so it can be applied inside the `okf-skills` repository.\r\n- **Queue & Telemetry Reset (`node okf-learn/scripts/learn.js --clear-notes | --reset`)**:\r\n  - `--clear-notes` empties `~/.okf/skill-learnings.jsonl` after skill improvements are applied; `--reset` clears both `~/.okf/telemetry.jsonl` and `~/.okf/skill-learnings.jsonl`.","concepts/okf-lint-skill":"# Overview\r\nThe `okf-lint` skill is a static analysis tool that guarantees documentation quality and prevents concept-code drift at the repository level in compliance with OKF Specification v0.2.\r\n\r\n# Verification Steps\r\n- **Conformance & Lifecycle Validation**: Checks that every concept has parseable frontmatter, a valid `type`, and (if present) a valid lifecycle `status` (`draft | stable | deprecated`, §5.4).\r\n- **Provenance & Footnote Attribution (§5.1, §7)**: Validates structured `sources` objects (`resource` required, `sources[].author` actor format without `agent:` prefix) and checks that any `sources[].id` defined for inline attribution is referenced by a matching `[^id]` footnote in the Markdown body (and vice versa).\r\n- **Attested Computation Verification (§10)**: Validates `runtime`, `computation`, `executor`, and `attester` metadata on `Attested Computation` concepts, and warns if neither a frontmatter `computation` URI nor an inline `# Computation` section is provided (§10.3).\r\n- **Link Integrity**: Checks that all internal markdown links (`[Label](/concepts/target.md)`) target files that exist. Strips fenced code blocks and inline code spans that wrap full markdown links while unwrapping backtick-formatted link labels (e.g. `` [`GatewayService/okf/`](...) ``) before bare-label checks.\r\n- **Missing Local Resource Detection**: Warns when an active (non-deprecated) concept binds a local `resource:` or `sources:` file path that does not exist on disk (`Warning: Missing local resource`), catching deleted files or cross-branch drift immediately while decoding percent-encoded `file://` URIs (e.g. `%20`), stripping `#fragment`/`?query` suffixes, and ignoring non-path URI schemes such as `git:<sha>:<path>`.\r\n- **Concept Drift (`--drift`)**: Compares the effective concept timestamp (the later of frontmatter `generated.at`/`timestamp` and, when the concept file is clean in the working tree, its Git commit timestamp via `getEffectiveConceptTime`, plus same-commit co-modification detection via `isCoModifiedInLatestCommit` so committing maintained concepts alongside bound files or directories never causes false post-commit drift) with the latest modification timestamp of associated `resource`, `sources` (string and object entries, resolving concept-to-concept dependencies against their effective frontmatter timestamp via `getResourceEffectiveModifiedISO` to prevent sub-second `writeFileSync` skew), `computation`, `executor.resource`, and `attester.resource` paths (checking both batched repository-wide `git log -m --format=__OKF_COMMIT__%H|%aI --name-only` via `getRepoCommitTimeMap` and batched uncommitted working-tree/staged `mtime` via `git -c core.quotepath=false status --porcelain -uall`, while exempting reserved bundle files `log.md`, `index.md`, and `viz.html` from triggering drift). Also emits a `[Drift Warning]` if any modified/added workspace code file is not bound to any concept, and resolves `workspaceRoot` from `--bundle <path>` when invoked outside the target repository.\r\n- **Freshness & Stale Concepts**: Validates the optional `stale_after` timestamp instant (§5.4). Emits a warning when the current date has surpassed the concept's `stale_after` date, flagging that the concept needs re-verification.\r\n- **Agent Steering Notice Auditing**: Audits all present agent steering files (`AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `.windsurfrules`, `.clinerules`, `GEMINI.md`) in the workspace root for outdated steering templates (v1.8.2) or missing Pre-Work Grounding Gates, Model-Tier Routing, or Pre-Completion Verification Gates.\r\n- **Machine-Readable Output (`--json`)**: Emits structured JSON summary metrics for automated CI/CD pipelines and agent reasoning, and records passive execution telemetry (`durationMs`, `errorsCount`, `warningsCount`, `driftCount`, and `slow_exec`/`lint_error` anomalies) to `~/.okf/telemetry.jsonl` (`recordTelemetry`).","concepts/okf-maintain-skill":"# Overview\r\nThe `okf-maintain` skill runs post-edit to verify that codebase modifications match the state of OKF concepts. It provides both an automated CLI maintenance script ([`maintain.js`](/okf-maintain/scripts/maintain.js)) for rapid mechanical upkeep and guided workflows for authoring new concepts when architecture changes.\r\n\r\n# Architecture & CLI Automation\r\n- **Script**: Located at [`okf-maintain/scripts/maintain.js`](/okf-maintain/scripts/maintain.js).\r\n- **Execution Modes**:\r\n  - `node okf-maintain/scripts/maintain.js` (or `npm run okf:maintain`): Automatically detects concept-resource drift across `resource`, `sources` (string and object entries, resolving concept-to-concept dependencies via `getResourceEffectiveModifiedISO` and auto-healing stale Vite/Webpack content-hashed asset bindings inside `assets/` when a replacement hashed bundle exists on disk via `healStaleHashedAssetBindings`), `computation`, `executor.resource`, and `attester.resource` (including directory bindings, while decoding percent-encoded `file://` URIs, stripping `#fragment`/`?query` suffixes, ignoring non-path schemes like `git:323eae6:...`, and exempting reserved bundle files `log.md`/`index.md`/`viz.html` from triggering drift) via both batched repository-wide committed Git history (`getRepoCommitTimeMap` using a single `git log -m --format=__OKF_COMMIT__%H|%aI --name-only` pass per repo, crediting a clean concept file's own commit timestamp via `getEffectiveConceptTime` and checking same-commit co-modification via `isCoModifiedInLatestCommit` to prevent false post-commit drift when code and maintained concepts are committed together) and batched uncommitted working-tree/staged changes (`git -c core.quotepath=false status --porcelain -uall` + filesystem `mtime`), propagates drift transitively across concept-to-concept dependencies in a single pass, preserves native CRLF/LF line endings in both concepts and steering files while stamping all updated concepts with a shared `syncDate` and `fs.utimesSync`, normalizes both string and object entries in `sources:`, refreshes `generated.at`, auto-heals outdated agent steering notices (`AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `.windsurfrules`, `.clinerules`, `GEMINI.md`) to the v1.8.2 template (including Model-Tier Routing and auto-healing `node ~/` commands on Windows) without user prompting, detects and auto-indexes unindexed active concepts into `index.md` (`findUnindexedConcepts` / `updateIndexConcepts`), scans for unindexed frontier files (skipping `archive/`, nested git repositories, build/cache/scratch directories such as `__pycache__`/`scratch`/`.scratch`, compiled bytecode/binary/dump extensions including `.bin`/`.rdb`/`.elf`/`.hex`/`.uf2`/`.map`, content-hashed build bundles in `assets/` via `isHashedBuildAsset`, static media/font/office/archive assets such as `.jpg`/`.png`/`.svg`/`.pdf`/`.xlsx`/`.zip`/`.pkpass`, auxiliary/steering files such as `README.md`/`AGENTS.md`/`CLAUDE.md`, ancestor `.gitignore` rules up to the enclosing Git root, the active OKF bundle, any nested bundle whose `index.md` declares `okf_version`, and any child sub-package directory that hosts its own nested OKF bundle), treats files inside a bound ancestor directory or already mentioned anywhere in the bundle (`index.md`, `log.md`, or concept markdown bodies, including backtick-quoted filenames and ellipsis-abbreviated `` `…<suffix>` `` references) as covered, edits only single-line auto-generated `- \\`path\\` — Undocumented codebase file.` bullets inside `## Not yet specified` in `index.md` while preserving hand-written single-line and multi-line notes, prose, and subsequent `## ` sections byte-for-byte, reports and logs the exact frontier delta (`+X new, -Y removed, Z already listed` via `frontierDelta`), appends entries to `log.md` (preserving chronological `Newest entries at the bottom` / ascending `## YYYY-MM-DD` ordering vs. reverse-chronological ordering and preserving blank lines after `## YYYY-MM-DD` headings), and verifies with `okf-lint --drift` (regenerating `viz.html` only when `--viz` is explicitly passed). If no bundle exists on the current branch, `findBundlesOnOtherBranches` checks local Git branches and prints a `git checkout <branch> -- <bundlePath>` hint. Resolves `workspaceRoot` directly from `--bundle <path>` for both standalone repositories and monorepo sub-packages.\r\n  - `node okf-maintain/scripts/maintain.js --check`: Non-destructive audit mode that exits with code 1 if committed or working-tree drift, unindexed active concepts (`unindexedConcepts`), unindexed frontier files (`unindexedFrontier`), or outdated steering notices (`outdatedSteering`) are found.\r\n  - `node okf-maintain/scripts/maintain.js --json`: Outputs structured JSON for CI and subagent tooling.\r\n  - `node okf-maintain/scripts/maintain.js --evaluate [conversation-id | --latest] [--brain-dir <path>] [--json] [--reset]`: Evaluates agent session transcripts (`transcript.jsonl`) and passive CLI telemetry (`~/.okf/telemetry.jsonl`, overridable via `OKF_TELEMETRY_PATH` / `--telemetry` and disableable via `OKF_DISABLE_TELEMETRY=1`) to score OKF Steering Gate compliance, surface query misses, >40KB context bloat truncations, backgrounded slow commands, and `edit_file` errors, and emit prioritized self-improvement recommendations (or reset telemetry when `--reset` is passed). Normal sync mode also emits a 1-line `[OKF Self-Improvement]` nudge (including missed query file paths in brackets) directing the agent to invoke [OKF Learn Skill](/concepts/okf-learn-skill.md) when anomalies occurred since the last sync.\r\n\r\n# Steering Template\r\n`buildSteeringDirectivesBlock(bundleRelPath, targetVersion, skillsBase)` renders the steering block (about 450 tokens) in this order: `## 📂 Knowledge Bundle / OKF` (where the bundle is, the closest-parent `okf/` rule, the session-start lint/maintain sync), `## ⚡ Pre-Work Grounding Gate` (1 Search, 2 Per-file context, 3 Cite, 4 Model-Tier Routing) and `## ⚡ Pre-Completion Verification Gate` (1 Semantic Concept & Source Binding Upkeep, 2 Maintain, 3 Lint), then the version tag.\r\n- **Runnable commands**: `resolveSkillsBase(workspaceRoot, options)` builds the script path prefix from `maintain.js`'s own install location. The prefix is workspace-relative when the skills live in the repo (in this repo it is empty, so commands read `node okf-query/...`), `~/`-relative on POSIX when they live under the home directory, and forward-slash absolute on Windows (`win32`, since PowerShell/cmd do not expand `~/` when passed as an argument to `node`). The bundle path is written workspace-relative with no leading slash (e.g. `docs/okf`).\r\n- **Compatibility contract**: `okf-lint` and `okf-maintain --check` require the strings `Pre-Work Grounding Gate`, `Pre-Completion Verification Gate`, `Model-Tier Routing` and the `<!-- okf-steering-version: X -->` tag. `scripts/test-lifecycle.js` also asserts `Semantic Concept & Source Binding Upkeep`. Keep all of these when editing the template.\r\n- Both helpers are exported from `maintain.js`.\r\n\r\n# Workflow\r\n1. **Guard check**: Verifies the bundle directory exists (in this repo, `/docs/okf`).\r\n2. **Scan changes**: Maps modified or newly added code files, API routes, computation scripts, or database schemas to OKF concepts.\r\n3. **Update concepts**: Updates frontmatter metadata (especially the `generated` block) and documents new facts/schemas.\r\n4. **Scale & Refactor Links**: Detects scale transitions (from flat to nested when concept count passes 10) and refactors all relative link references accordingly.\r\n5. **Update reserved files**: Appends to `log.md` and indexes new files/directories in `index.md`.\r\n6. **Verify conformance**: Ensures all concept files carry a valid `type` in their YAML frontmatter.","concepts/okf-prune-skill":"# Overview\r\nThe `okf-prune` skill manages bundle hygiene and concept lifecycles by detecting and cleaning up outdated or invalid knowledge documents. It provides automated CLI workflows for archiving or permanently removing expired, deprecated, orphaned, or broken concepts.\r\n\r\n# Key Functions\r\n- **Audit & Check Mode**: Detects concepts that have passed `stale_after` expiration, carry `status: deprecated`, reference deleted local files across `resource`, `sources` (string and object entries), `computation`, `executor.resource`, and `attester.resource` (while decoding percent-encoded `file://` URIs, stripping `#fragment`/`?query` suffixes, safely ignoring non-`file://` URI schemes like `bigquery://` or `git:<sha>:<path>` and scope descriptors, and resolving `workspaceRoot` automatically when `--bundle <path>` points to another repository), or have zero inbound links across markdown body links and `sources` concept lineage references.\r\n- **Safe Archiving**: By default, moves pruned concepts into an `archive/` directory within the bundle, updates frontmatter with `status: deprecated` and `archived_at`, and relocates concept links in `index.md` to an `## Archived Concepts` section while preserving native CRLF/LF line endings across concept files, `index.md`, and `log.md`.\r\n- **Permanent Deletion Mode**: Allows complete removal of obsolete concepts via the `--delete` flag.\r\n- **Category Filtering**: Allows selective pruning targeting only stale (`--stale`), deprecated (`--deprecated`), ghost (`--ghosts`), or orphaned (`--orphans`) concepts.\r\n- **Changelog & Visualization Sync**: Appends entries to `log.md` detailing pruned items (and optionally refreshes `viz.html` when `--viz` is passed).","concepts/okf-query-skill":"# Overview\r\nThe `okf-query` skill retrieves context from the OKF bundle to inject it directly into the prompt of developers or active coding agents, closing the gap between writing and using documentation.\r\n\r\n# Operation Modes\r\n- **File Matching (`--file <path[,path2,...]>`)**: Accepts one or more file paths (comma-separated, space-separated, or repeated `--file` flags), deduplicating matched concepts across all queried paths. Matches active concept `.md` files directly at Tier 1A (`primary`) when a concept file path is queried, and checks `resource`, `sources` (supporting both shorthand string arrays and structured object arrays, decoding percent-encoded `file://` URIs, stripping `#fragment`/`?query` suffixes, and ignoring non-path schemes like `git:<sha>:<path>`), `computation`, `executor.resource`, and `attester.resource` across all active concepts (skipping `archive/`). Ranks primary resource bindings (`resource`, `computation`, `executor.resource`, `attester.resource`) ahead of secondary `sources` bindings, falls back to path-suffix and basename matching when a queried relative path does not exist on disk, and then falls back to Tier 2 subsystem/directory matching.\r\n- **Keyword Search (`--search <query>`)**: Accepts quoted or unquoted multi-word search queries and scans all active concepts' frontmatter fields (`title`, `description`, `tags`, `type`, `resource`, `sources` strings/objects/authors/ids, `runtime`, `computation`, `executor.resource`, `attester.resource`), relative file paths, and body content for the specified query. Supports exact phrase matching and header-weighted multi-word tokenized ranking (`tokenizeSearchQuery`), falling back to concepts matching at least half (minimum 2) of the query tokens when no concept contains every token, emits `No matching OKF concepts found for search: <query>` when no concept matches, and resolves `workspaceRoot` from `--bundle <path>` when querying an external repository.\r\n- **Output**: Formats the selected concepts (including `File`, `Runtime`, and `Computation` metadata when present) into a clean markdown context block suitable for prompt ingestion. Renders all primary `--file` concepts (and up to 3 total `--file` concepts or top 5 `--search` concepts) within a cumulative 24,000-character body budget (`MAX_TOTAL_BODY_CHARS = 24000`, `MAX_CONCEPT_CHARS = 12000` per concept) while compacting additional secondary/lower-ranked matches to metadata headers unless `--full` is passed. Concepts larger than their per-concept character budget automatically output a section outline plus matching `--search` sections (or an excerpt) unless `--full` is passed.\r\n- **Passive Telemetry**: Records zero-token execution telemetry (`matchCount`, `matchTiers`, `outputBytes`, `durationMs`, and `query_miss`/`fallback_used`/`context_bloat`/`slow_exec` anomalies) to `~/.okf/telemetry.jsonl` (`recordTelemetry`).","concepts/okf-skill":"# Overview\r\nThe `okf` skill defines the Open Knowledge Format (OKF) rules for writing self-documenting codebases, directly implementing the [OKF Specification v0.2](/concepts/okf-specification.md). It serves as the single source of truth for how a concept is authored, linked, structured, and organized.\r\n\r\n# Key Features\r\n- **YAML Frontmatter**: Requires `type`, recommends `title`, `description`, `resource`, `tags`, `status`, `stale_after`, `generated`, `verified`, and `sources` (both shorthand string lists and structured provenance objects).\r\n- **Bundle Directory**: In this repository, it is located at `/docs/okf`.\r\n- **Cross-linking**: Uses bundle-relative absolute paths to form an untyped concept dependency graph.\r\n- **Directory Organization**: Outlines how to transition from a flat layout to a nested directory structure as the concept count scales (>= 10 concepts).\r\n- **Steering Notice (v1.8.2)**: Sets up agent steering files (e.g. `AGENTS.md`, `CLAUDE.md`, `.cursorrules`, `GEMINI.md`) with mandatory Pre-Work Grounding Gates (including Step 4: Model-Tier Routing, directing agents to use the **High** reasoning setting during bundle bootstrapping, domain discovery, and planning, then switch back to **Medium** for implementation) and 3-step Pre-Completion Verification Gates on the **Medium** setting (Step 1: Semantic Concept & Source Binding Upkeep, Step 2: Maintain, Step 3: Lint), rendered by the concise template in [OKF Maintain Skill](/concepts/okf-maintain-skill.md).","concepts/okf-specification":"# Overview\n\nThe [Open Knowledge Format (OKF)](/concepts/okf-specification.md) is an open, human- and agent-friendly specification for capturing and exchanging curated knowledge that surrounds code, data, and systems. Version 0.2 standardizes metadata conventions making agent-maintained knowledge corpora trustable, fresh, and auditable without bespoke runtimes.\n\n# Core Principles\n\n- **Readable**: Plain UTF-8 markdown files viewable without proprietary tooling.\n- **Parseable**: Standard YAML frontmatter parseable across all agent platforms.\n- **Diffable**: Trackable and reviewable in git version control.\n- **Portable**: Shareable across repositories, organizations, and runtime environments.\n\n# Key Specification Elements\n\n## 1. Bundle Structure & Reserved Files\n- **Concepts**: Every non-reserved `.md` document represents a concept and requires a non-empty `type` in frontmatter.\n- **`index.md`**: Directory listing supporting progressive disclosure. The bundle-root `index.md` may declare `okf_version: \"0.2\"`.\n- **`log.md`**: Chronological update log using `## YYYY-MM-DD` date headings.\n\n## 2. Provenance, Trust, and Lifecycle\n- **Provenance (`sources`)**: Structured list of reference materials, with credibility signals (`author`, `usage_count`, `last_modified`) and `usage_window`. Claims can cite sources using markdown footnotes (`[^id]`).\n- **Trust (`generated` & `verified`)**:\n  - `generated: { by, at }`: Records author identity using the actor format `<producer>/<version>`, `human:<id>`, or `process:<id>`, alongside an ISO 8601 UTC timestamp.\n  - `verified: [{ by, at }]`: Records independent confirmation events, inferring trust tiers: `unverified`, `machine-confirmed`, or `human-reviewed`.\n- **Lifecycle (`status` & `stale_after`)**:\n  - `status`: `draft`, `stable` (default), or `deprecated`.\n  - `stale_after`: Absolute ISO 8601 UTC instant marking content expiration.\n\n## 3. Attested Computations\nConcepts of `type: Attested Computation` bind a sanctioned calculation contract:\n- `runtime`: Execution environment (e.g. `bigquery`, `postgres`, `python`, `dbt`).\n- `parameters`: Typed parameter specifications for deterministic substitution.\n- `computation`: Inline block under `# Computation` or an external file path.\n- `executor` & `attester`: References to run instructions/receipts and deterministic verification code.\n\n# Repository Implementation\n\nIn this repository, the specification is implemented and supported across the skill suite:\n- [OKF Core Skill](/concepts/okf-skill.md) — Authoring concepts according to the format.\n- [OKF Lint Skill](/concepts/okf-lint-skill.md) — Conformance validation, link integrity, and drift analysis.\n- [OKF Query Skill](/concepts/okf-query-skill.md) — Provenance search and context injection.\n- [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md) — Automated migration from v0.1 to v0.2.\n- [OKF Visualize Skill](/concepts/okf-visualize-skill.md) — Interactive Cytoscape graph rendering.\n- [The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md) — Closed-loop lifecycle binding the skills.","concepts/okf-upgrade-skill":"# Overview\r\nThe `okf-upgrade` skill automates the migration of legacy OKF bundles to the v0.2 specification, upgrading metadata formats, actor identifiers, and provenance citations while preserving existing v0.2 fields.\r\n\r\n# Key Functions\r\n- Converts legacy `timestamp` keys into structured `generated: { by, at }` properties and normalizes actor strings (stripping prohibited `agent:` prefixes in `generated.by`, `verified.by`, `executor.by`, `attester.by`, and `sources[].author` per §5.1, §7).\r\n- Migrates inline body `# Citations` lists to frontmatter `sources` lists while preserving both v0.2 shorthand string sources and structured source objects (`id`, `resource`, `title`, `author`, `usage_count`, `last_modified`), automatically splits comma-separated local `resource:` paths into primary `resource` (first existing path) + `sources` (remaining existing paths without duplicating `resource` or adding non-existent paths), and unwraps backtick-formatted link labels when auto-fixing bare links.\r\n- Enforces `okf_version: \"0.2\"` on root `index.md` while stripping legacy frontmatter keys (`type`, `title`, `description`, `generated`) per §12, normalizes both `## YYYY-MM-DD` and bullet-dated (`- **YYYY-MM-DD** — ...`) `log.md` entries to `## YYYY-MM-DD` sections, and preserves native CRLF/LF line endings across all files.\r\n- Supports custom and sub-package bundle paths via `--bundle <path>`, skips archived concepts under `archive/`, triggers post-migration lint validation, and provides multi-agent skill self-updating (`--skills` / `--self` / `--all`) across Google Antigravity (`~/.gemini/config/skills`), Claude Code profiles (`~/.claude/skills`, `~/.claude-*/skills`, `$CLAUDE_CONFIG_DIR/skills`), OpenAI Codex profiles (`~/.codex/skills`, `~/.codex-*/skills`, `$CODEX_HOME/skills`), and universal `.agents/skills` (while fast-forwarding `~/okf-skills` when present).","concepts/okf-visualize-skill":"# Overview\r\nThe `okf-visualize` skill parses the active concepts in the OKF bundle, extracts their frontmatter metadata and internal markdown links, builds a concept network graph, and compiles it into a self-contained interactive `viz.html` page.\r\n\r\n# Architecture & Script\r\n- **Script**: Located at [visualize.js](/okf-visualize/scripts/visualize.js).\r\n- **Templates**: Located under [templates/viz.html](/okf-visualize/templates/viz.html).\r\n- **Workflow**:\r\n  1. Walks the bundle directory (skipping `index.md`, `log.md`, and `archive/`) to read active concepts.\r\n  2. Extracts YAML frontmatter (including OKF v0.2 `generated`, `verified`, `sources` strings & objects, `usage_window`, and `Attested Computation` fields `runtime`, `parameters`, `computation`, `executor`, `attester`) and internal links across Markdown body, `sources`, `computation`, `executor.resource`, and `attester.resource`.\r\n  3. Builds Cytoscape.js nodes (colored by `type` across standard and architectural taxonomy types) and edges (`links` and `derived-from`).\r\n  4. Injects CSS, JS, and bundle JSON into the HTML template, rendering rich provenance, credibility signals (`usage_count`, `last_modified`), and Attested Computation metadata in the interactive sidebar.\r\n  5. Outputs `viz.html` to the bundle root and copies it to the active conversation's artifact directory for easy rendering in the agent chat interface.","concepts/okf-wayfinder-skill":"# Overview\r\nThe `okf-wayfinder` skill serves as an interactive knowledge cartographer for the OKF bundle. It runs a developer-facing questionnaire combined with automated codebase telemetry to bridge the gap between static code structures and dynamic tribal business context, producing `human-reviewed` concepts that conform to [OKF Specification v0.2](/concepts/okf-specification.md).\r\n\r\n# Key Features\r\n- **Registry, Graph & Taxonomy Discovery**: Runs [`wayfinder_taxonomy.js`](/okf-wayfinder/scripts/wayfinder_taxonomy.js) (`npm run okf:wayfinder` or `--bundle <path>`) to extract existing `types`, `tags`, `concepts` (with ready-to-use `markdownLink` strings), `layoutMode` (`flat` vs `nested`), active `subdirectories`, and undocumented workspace files (`frontier`). Automatically tracks `resource`, `sources`, and `Attested Computation` dependencies (`computation`, `executor.resource`, `attester.resource`) including directory-level bindings and percent-encoded `file://` URIs, while ignoring archived concept folders, nested git repositories, static media/font/office/archive assets (`.jpg`, `.png`, `.svg`, `.pdf`, `.xlsx`, `.zip`, `.pkpass`, etc.), auxiliary/steering files (`README.md`, `AGENTS.md`, `CLAUDE.md`, etc.), the active OKF bundle, nested OKF bundles (`index.md` with `okf_version`), and child sub-packages that host their own nested OKF bundle.\r\n- **Clustered Frontier Proposals (`frontierGroups`)**: Groups undocumented workspace files by directory/module with a suggested `type`, primary `resource` candidate (`primaryCandidate`), and companion `sources` (`companionFiles`) so an entire module graduates out of `## Not yet specified` in `index.md` in a single interview.\r\n- **Automated File Telemetry (`--inspect <file>`)**: Extracts exported symbols, local relative imports/requires, auto-resolved `relatedConcepts` cross-links, `git log -1` timestamps (`lastModified`), and primary Git contributors (`suggestedVerifierActor`) to pre-fill draft concepts.\r\n- **Type-Aware Focus Interview**: Limits user fatigue to at most three targeted questions tailored to the concept type (`Concept`, `Skill`, `Utility`, `Playbook`, `Decision`, or `Attested Computation`), utilizing native structured question tools (`ask_question` / `AskUserQuestion`) when available.\r\n- **Human-Reviewed Trust Attestation & Post-Authoring Sync**: Records developer approval in `verified: [{ by: human:<id>, at: <ISO-8601> }]` to immediately establish the `human-reviewed` trust tier, and finishes by invoking [OKF Maintain Skill](/concepts/okf-maintain-skill.md) and [OKF Lint Skill](/concepts/okf-lint-skill.md) (`--drift`) to update `index.md` and `log.md`.\r\n- **Model-Tier Steering**: Recommends running on the **High** reasoning setting of the active model during initial bundle bootstrapping and interactive concept discovery interviews, then switching back to **Medium** for implementation and routine upkeep.","concepts/skill-catalog-sync":"# Overview\r\nWhenever an OKF skill is **added**, **modified**, or **deleted** in this repository, every documentation surface, interactive simulator tab, installer script, test runner, and OKF concept must remain 100% synchronized. This playbook defines the canonical synchronization contract and the automated invariant verifier enforced by [`scripts/sync-skills.js`](/scripts/sync-skills.js) (`npm run okf:sync` / `npm run okf:sync:check`).\r\n\r\n# Automated Synchronization & Invariant Gate (`scripts/sync-skills.js`)\r\nRunning `node scripts/sync-skills.js` (automatically invoked by [OKF Maintain Skill](/concepts/okf-maintain-skill.md) and verified in CI by `scripts/test-parser.js` via `--check`) performs two jobs:\r\n\r\n1. **Automated Content Synchronization**:\r\n   - **`index.html` ([Interactive Simulator & Playbook](/concepts/interactive-simulator.md))**: Injects the live `SKILL.md` and script contents for all pipeline steps (`#details-panel-2` through `#details-panel-11`, mapped via `PANEL_MAPPINGS`) directly into `<pre><code>` blocks in `index.html`.\r\n   - **`README.md` ([The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md))**: Rewrites the `npx skills@latest update <SKILLS>` and `npx skills@latest remove <SKILLS>` command lines from the canonical `SKILLS` array (`buildSyncedReadmeMd`).\r\n   - **Local Skill Mirrors**: Synchronizes `.agents/skills/<skill>` and `agent/skills/<skill>` mirrors when present.\r\n\r\n2. **Cross-Repo Catalog Invariant Verification (`verifyCatalogInvariants`)**:\r\n   - **Disk vs. `SKILLS` Registry**: Scans the repository root for all `okf` / `okf-*` directories containing a `SKILL.md` file and fails if any on-disk skill is missing from `SKILLS` or if any entry in `SKILLS` lacks `<skill>/SKILL.md` on disk.\r\n   - **`index.html` Simulator Coverage**: Verifies every skill in `SKILLS` has a `<skill>/SKILL.md` entry in `PANEL_MAPPINGS` and a matching panel ID in `index.html`.\r\n   - **`README.md` Documentation Coverage**: Verifies every skill in `SKILLS` is linked in both `## 🔄 The Knowledge Loop Lifecycle` (`[<skill>/SKILL.md](<skill>/SKILL.md)`) and `## 🛠️ Repository Contents` (`**[<skill>/](<skill>/)**`).\r\n   - **Installer & Bundle Index Coverage**: Verifies every skill in `SKILLS` is registered in [OKF Upgrade Skill](/concepts/okf-upgrade-skill.md) (`okf-upgrade/scripts/upgrade.js`), [Skill Installer Scripts](/concepts/skill-installers.md) (`install.ps1` and `install.sh`), and `docs/okf/index.md` (`concepts/<skill>-skill.md`).\r\n\r\n# Checklist for Adding, Modifying, or Deleting a Skill\r\n\r\n## 1. Modifying an Existing Skill (`<skill>/SKILL.md` or `<skill>/scripts/*.js`)\r\n1. Edit `<skill>/SKILL.md` and/or `<skill>/scripts/*.js`.\r\n2. Update `README.md` or `index.html` prose if user-facing flags or workflow steps changed.\r\n3. Update `docs/okf/concepts/<skill>-skill.md` and `docs/okf/log.md`.\r\n4. Run `node scripts/sync-skills.js` and `node okf-maintain/scripts/maintain.js` (which refreshes `index.html` code panels, `README.md` CLI lists, and concept timestamps).\r\n\r\n## 2. Adding a New Skill (`okf-<name>`)\r\n1. **Create Skill Files**: Author `okf-<name>/SKILL.md` (with `name`, `description`, `version`) and `okf-<name>/scripts/<name>.js`.\r\n2. **Register in `scripts/sync-skills.js`**:\r\n   - Add `'okf-<name>'` to `SKILLS`.\r\n   - Add its panel mapping (`{ panelId: '...', header: '# okf-<name>/SKILL.md', relFile: 'okf-<name>/SKILL.md' }`) to `PANEL_MAPPINGS`.\r\n3. **Update `index.html` ([Interactive Simulator & Playbook](/concepts/interactive-simulator.md))**:\r\n   - Add the `#toggle-step-N` radio input, CSS `:checked` rules, `.pipeline-card` (`#step-card-N`), and `.details-panel` (`#details-panel-N`) containing the `SKILL.md` and script `<pre><code>` panels.\r\n4. **Update `README.md` ([The Knowledge Loop Lifecycle](/concepts/knowledge-loop.md))**:\r\n   - Add the step node to the `## 🔄 The Knowledge Loop Lifecycle` Mermaid diagram and add a numbered `### N.` subsection with `* **Component**: [okf-<name>/SKILL.md](okf-<name>/SKILL.md)`.\r\n   - Add `* **[okf-<name>/](okf-<name>/)**: ...` under `## 🛠️ Repository Contents`.\r\n5. **Register in Installers, Upgrader & `package.json`**:\r\n   - Add `'okf-<name>'` to `SKILLS` in `okf-upgrade/scripts/upgrade.js`, `$skills` in `install.ps1`, and `SKILLS` in `install.sh`.\r\n   - Add `okf:<name>` npm script in `package.json`.\r\n   - If the skill exports `parseFrontmatter`, add it to `parsers` in `scripts/test-parser.js`.\r\n6. **Create OKF Concept**:\r\n   - Create `docs/okf/concepts/okf-<name>-skill.md` and index it in `docs/okf/index.md` and `docs/okf/concepts/knowledge-loop.md`.\r\n7. **Sync & Verify**:\r\n   - Run `node scripts/sync-skills.js`, `node okf-maintain/scripts/maintain.js`, `node okf-lint/scripts/lint.js --drift`, and `npm test`.\r\n\r\n## 3. Deleting or Deprecating a Skill\r\n1. Remove the skill directory (or archive its concept via [OKF Prune Skill](/concepts/okf-prune-skill.md)).\r\n2. Remove the skill entry from `SKILLS` and `PANEL_MAPPINGS` in `scripts/sync-skills.js`, `index.html`, `README.md`, `okf-upgrade/scripts/upgrade.js`, `install.ps1`, `install.sh`, `package.json`, and `scripts/test-parser.js`.\r\n3. Run `node scripts/sync-skills.js --check` and `npm test` to confirm zero dangling references remain.","concepts/skill-installers":"# Overview\r\nThe installer scripts, `install.ps1` (for Windows PowerShell) and `install.sh` (for macOS/Linux Bash), automate the process of registering, updating, and removing the OKF skills globally on a developer's system.\r\n\r\n# Supported Agents & Paths\r\nThe script detects and installs the skills to the configuration folders of all active LLM agent CLIs:\r\n- **Google Antigravity / Gemini CLI**: `~/.gemini/config/skills`\r\n- **Claude Code**: `~/.claude/skills`, plus any custom profile directories (`~/.claude-*/skills`) and `$CLAUDE_CONFIG_DIR/skills`\r\n- **OpenAI Codex CLI**: `~/.codex/skills`, plus any custom profile directories (`~/.codex-*/skills`) and `$CODEX_HOME/skills`\r\n- **Universal / General Agents**: `~/.agents/skills`\r\n\r\n# Operations\r\n- **Install/Update**: Copies the skill directories (`okf/`, `okf-maintain/`, `okf-visualize/`, `okf-wayfinder/`, `okf-lint/`, `okf-query/`, `okf-upgrade/`, `okf-prune/`, and `okf-learn/`) directly to target directories, overwriting previous versions. If run outside a clone, it fetches the zip from the GitHub main branch.\r\n- **Remove**: Deletes the skill folders recursively from the target paths."},"types":["Concept","Playbook","Reference","Skill","Utility"],"palette":{"BigQuery Dataset":"#8b5cf6","BigQuery Table":"#3b82f6","Reference":"#10b981","Attested Computation":"#f59e0b","Concept":"#0ea5e9","Skill":"#6366f1","Playbook":"#ec4899","Utility":"#14b8a6","Decision":"#f97316","Metric":"#eab308","Subsystem":"#2563eb"}};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function appendDynamicRow(dl, label, valueNodeOrText) {
    const dt = document.createElement("dt");
    dt.className = "dynamic-fm";
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.className = "dynamic-fm";
    if (typeof valueNodeOrText === "string") {
      dd.textContent = valueNodeOrText;
    } else {
      dd.appendChild(valueNodeOrText);
    }
    dl.appendChild(dt);
    dl.appendChild(dd);
    return dd;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    // Dynamic v0.2 metadata display
    const dl = document.querySelector("dl.frontmatter");
    if (dl) {
      const existingDynamics = dl.querySelectorAll(".dynamic-fm");
      existingDynamics.forEach(el => el.remove());

      if (data.status) {
        appendDynamicRow(dl, "Status", data.status);
      }

      if (data.stale_after) {
        const dd = appendDynamicRow(dl, "Stale After", data.stale_after);
        const isStale = new Date(data.stale_after) <= new Date();
        if (isStale) {
          const warning = document.createElement("span");
          warning.style.color = "#dc2626";
          warning.style.fontWeight = "bold";
          warning.style.marginLeft = "8px";
          warning.textContent = "(Stale)";
          dd.appendChild(warning);
        }
      }

      // Trust tier calculation (§5.3)
      let trustTier = "unverified";
      if (data.verified && (Array.isArray(data.verified) ? data.verified.length : Object.keys(data.verified).length)) {
        const verifications = Array.isArray(data.verified) ? data.verified : [data.verified];
        const hasHuman = verifications.some(v => v && v.by && String(v.by).startsWith("human:"));
        trustTier = hasHuman ? "human-reviewed" : "machine-confirmed";
      }
      const trustDd = appendDynamicRow(dl, "Trust Tier", trustTier);
      if (trustTier === "human-reviewed") {
        trustDd.style.color = "#16a34a";
        trustDd.style.fontWeight = "bold";
      } else if (trustTier === "machine-confirmed") {
        trustDd.style.color = "#2563eb";
      } else {
        trustDd.style.color = "#64748b";
      }

      // Generated metadata (§5.2)
      if (data.generated && (data.generated.by || data.generated.at)) {
        const parts = [];
        if (data.generated.by) parts.push(data.generated.by);
        if (data.generated.at) parts.push(`at ${data.generated.at}`);
        appendDynamicRow(dl, "Generated", parts.join(" "));
      }

      // Attested Computation metadata (§10.2)
      if (data.runtime) {
        appendDynamicRow(dl, "Runtime", data.runtime);
      }
      if (data.computation) {
        appendDynamicRow(dl, "Computation", data.computation);
      }
      if (Array.isArray(data.parameters) && data.parameters.length > 0) {
        const paramText = data.parameters
          .map(p => `${p.name}:${p.type || "any"}${p.required ? "*" : ""}`)
          .join(", ");
        appendDynamicRow(dl, "Parameters", paramText);
      }
      if (data.executor && data.executor.resource) {
        const receiptInfo = Array.isArray(data.executor.receipt) ? ` (receipt: ${data.executor.receipt.join(", ")})` : "";
        appendDynamicRow(dl, "Executor", `${data.executor.resource}${receiptInfo}`);
      }
      if (data.attester && data.attester.resource) {
        appendDynamicRow(dl, "Attester", data.attester.resource);
      }

      // Sources list (§5.1: supports both shorthand strings and structured objects)
      if (data.sources && data.sources.length && data.sources[0]) {
        const srcContainer = document.createElement("div");
        data.sources.forEach(src => {
          if (!src) return;
          const div = document.createElement("div");
          div.style.marginBottom = "4px";
          if (typeof src === "string") {
            const a = document.createElement("a");
            a.href = src;
            a.textContent = src;
            a.target = "_blank";
            a.rel = "noopener";
            a.className = "external";
            div.appendChild(a);
          } else {
            if (src.resource) {
              const a = document.createElement("a");
              a.href = src.resource;
              a.textContent = src.title || src.id || src.resource;
              a.target = "_blank";
              a.rel = "noopener";
              a.className = "external";
              div.appendChild(a);
            } else {
              div.textContent = src.title || src.id || "Unnamed source";
            }
            const metaParts = [];
            if (src.author) metaParts.push(`by ${src.author}`);
            if (src.usage_count !== undefined) metaParts.push(`usage: ${src.usage_count}`);
            if (src.last_modified) metaParts.push(`modified: ${src.last_modified}`);
            if (metaParts.length > 0) {
              const metaSpan = document.createElement("span");
              metaSpan.className = "muted";
              metaSpan.style.marginLeft = "6px";
              metaSpan.textContent = `(${metaParts.join(" · ")})`;
              div.appendChild(metaSpan);
            }
          }
          srcContainer.appendChild(div);
        });
        appendDynamicRow(dl, "Sources", srcContainer);
      }

      if (data.usage_window && (data.usage_window.from || data.usage_window.to)) {
        appendDynamicRow(dl, "Usage Window", `${data.usage_window.from || "?"} → ${data.usage_window.to || "?"}`);
      }
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Auto-show the first node (a dataset if available, else first concept)
  const initial =
    bundle.nodes.find((n) => n.data.type === "BigQuery Dataset") ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
